<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><style>
body{font:14px -apple-system,Helvetica,sans-serif;color:#1c1b19;margin:0;background:#fff}
h1{font-size:19px;margin:0 0 10px} p{margin:0 0 12px;line-height:1.5} b{font-weight:600}
/* #3232 + #3256: same dark-mode readability approach as welcome.html -- the page keeps its own
   background in both appearances, and no element sets its own background, so every line renders like
   the plain paragraphs (the installer does not reliably honour prefers-color-scheme, so the dark
   override is belt-and-braces rather than the thing being relied on). */
@media (prefers-color-scheme: dark){ body{ color:#f2f0ea; background:#1c1b19 } }
</style></head><body>
<h1>Kosmos is ready</h1>
<p>Kosmos has been installed successfully and should open automatically.</p>
<p>If it doesn't open, you can find Kosmos in your <b>Applications</b> folder.</p>
</body></html>
