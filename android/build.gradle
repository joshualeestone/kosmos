// Root build script. The Android Gradle Plugin is declared here and applied in
// app/build.gradle. Pinned to AGP 8.13.0, which officially supports compileSdk 36
// (Play requires targetSdk 36, #4090), so no suppressUnsupportedCompileSdk flag is
// needed. 8.13.0 is the latest 8.x; AGP 9.x is a separate major-version upgrade.
plugins {
    id 'com.android.application' version '8.13.0' apply false
}
