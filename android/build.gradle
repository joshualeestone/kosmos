// Root build script. The Android Gradle Plugin is declared here and applied in
// app/build.gradle. Pinned to AGP 8.6.1. The module compiles against compileSdk 36
// (Play requires targetSdk 36, #4090); AGP 8.6.1 predates API 36, so
// android.suppressUnsupportedCompileSdk=36 in gradle.properties lets it compile against
// 36 without an AGP upgrade (that upgrade is tracked as a follow-up).
plugins {
    id 'com.android.application' version '8.6.1' apply false
}
