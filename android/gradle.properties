org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The Gradle DAEMON must run on JDK 21 (see gradle/gradle-daemon-jvm.properties,
# toolchainVersion=21). This box's system-default JDK is 26, which Gradle's
# build-script compiler cannot read ("Unsupported class file major version 70"),
# so a fresh clone that runs ./gradlew on the default JVM would fail. The daemon
# criteria fixes that machine-independently ONLY if Gradle can find an installed
# JDK 21. The line below registers this box's keg-only Homebrew JDK 21 so the
# criteria resolve without a system symlink. It is a per-machine hint: on another
# machine, remove or repoint it and let Gradle auto-detect a JDK 21 (or install one).
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
