# Robolectric 4.14.1 supports Android up to API 35. The app now targets API 36
# (Play requires targetSdk 36, #4090), and Robolectric otherwise defaults its emulated
# SDK to the manifest targetSdk, which would make the @RunWith(RobolectricTestRunner)
# suites error "Robolectric does not support API level 36" in :app:testDebugUnitTest
# (the CI "Unit tests" gate). Pin the JVM unit tests to API 35: they exercise app logic
# (launcher and address activities), not API-36-specific runtime behaviour.
# Remove this pin once Robolectric is upgraded to a version with API 36 support
# (same follow-up as the AGP upgrade noted in gradle.properties).
sdk=35
