plugins {
    id 'com.android.application'
}

// Release-signing inputs, resolved ONCE from the environment so the two config
// blocks below share a single source rather than each calling getenv. All are
// empty/absent unless an upload keystore has been provisioned (see the guarded
// usage below and android/README.md "Release signing"). No key material or
// password lives in git: the keystore itself is stored under ~/.config/secrets/
// (mode 600), filed via /add-secret, and is also covered by android/.gitignore's
// *.jks / *.keystore rules.
def uploadKeystore      = System.getenv("KOSMOS_UPLOAD_KEYSTORE")
def uploadStorePassword = System.getenv("KOSMOS_UPLOAD_STORE_PASSWORD")
def uploadKeyPassword   = System.getenv("KOSMOS_UPLOAD_KEY_PASSWORD")
def uploadKeyAlias      = System.getenv("KOSMOS_UPLOAD_KEY_ALIAS") ?: "kosmos-upload"

android {
    namespace 'io.kosmos.app'
    compileSdk 35

    defaultConfig {
        // NOTE: applicationId is the permanent Play-store identity. `io.kosmos.app`
        // was picked to mirror the old placeholder origin, not the current one;
        // confirm it before the first Play upload, because it cannot change afterwards
        // (android/README.md, "Confirm applicationId before the first Play upload").
        applicationId "io.kosmos.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            // Populated only when an upload keystore is provisioned. The block is
            // always declared so buildTypes.release can reference it without a
            // "signingConfig not found" error; its properties stay null otherwise.
            if (uploadKeystore) {
                storeFile file(uploadKeystore)
                storePassword uploadStorePassword
                keyPassword uploadKeyPassword
                keyAlias uploadKeyAlias
            }
        }
    }

    buildTypes {
        release {
            // No shrinking for the skeleton: a TWA has almost no app code, and
            // R8 on the browser-helper library adds build friction with no payoff
            // until there is real native code to shrink.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Attach the upload signing config only when the keystore AND both
            // passwords are present. On a partial env (keystore set, a password
            // missing) attaching anyway would configure a signingConfig with a null
            // password and then die later with an opaque packaging-task error; we
            // instead stay UNSIGNED and warn loudly. This preserves the keystore-
            // less "unsigned, not broken" behavior and leaves assembleDebug (which
            // never reads these vars) untouched in every case.
            if (uploadKeystore) {
                if (uploadStorePassword && uploadKeyPassword) {
                    signingConfig signingConfigs.release
                } else {
                    def missingVars = []
                    if (!uploadStorePassword) missingVars << "KOSMOS_UPLOAD_STORE_PASSWORD"
                    if (!uploadKeyPassword) missingVars << "KOSMOS_UPLOAD_KEY_PASSWORD"
                    project.logger.warn("KOSMOS_UPLOAD_KEYSTORE is set but " +
                        missingVars.join(" and ") + " is missing; the release build " +
                        "will be UNSIGNED. Resolve the kosmos-android-upload-signing " +
                        "credential (see android/README.md).")
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity support. Provides the LauncherActivity referenced in
    // AndroidManifest.xml, so this module ships zero hand-written Java/Kotlin.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
