# TEMP (#4301): measure win32apply's W4 on windows-latest, quiet and under load. Removed before the PR.
name: probe-4301
on:
  push:
    branches: ["w4-4301"]
permissions:
  contents: read
jobs:
  w4:
    strategy:
      fail-fast: false
      matrix:
        load: [0, 1, 2]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: the whole win32apply file, per-test durations, with LOAD whole-file runs alongside
        run: |
          for j in $(seq 1 ${{ matrix.load }}); do
            ( while true; do node --test engine/win32apply.test.js < /dev/null > /dev/null 2>&1; done ) &
          done
          for i in 1 2; do
            node --test engine/win32apply.test.js < /dev/null > full.txt 2>&1; echo "LOAD ${{ matrix.load }} pass $i exit $?"
            grep -E "^[✔✖] .*\(([0-9.]+)ms\)$" full.txt | awk -v L=${{ matrix.load }} -v P=$i '{ match($0, /\(([0-9.]+)ms\)$/, m); d=substr($0, RSTART+1, RLENGTH-4); if (d+0 > 8000) printf "LOAD %s pass %s SLOW %.0fms %s\n", L, P, d, substr($0, 1, 110) }'
            grep -E "^ℹ (tests|pass|fail|duration_ms)" full.txt | sed "s/^/LOAD ${{ matrix.load }} pass $i /"
          done
