# TEMP (#4301): measure win32apply's W4 on windows-latest, quiet and under load. Removed before the PR.
name: probe-4301
on:
  push:
    branches: ["w4-4301"]
permissions:
  contents: read
jobs:
  w4:
    strategy:
      fail-fast: false
      matrix:
        load: [0, 1, 2]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: the whole win32apply file, per-test durations, with LOAD whole-file runs alongside
        run: |
          for j in $(seq 1 ${{ matrix.load }}); do
            ( while true; do node --test engine/win32apply.test.js < /dev/null > /dev/null 2>&1; done ) &
          done
          for i in 1 2; do
            node --test engine/win32apply.test.js < /dev/null > full.txt 2>&1 && rc=0 || rc=$?
            echo "LOAD ${{ matrix.load }} pass $i exit $rc"
            node -e '
              const t = require("fs").readFileSync("full.txt", "utf8").replace(/\r/g, "");
              for (const l of t.split("\n")) {
                const m = l.match(/^([✔✖]) (.+) \(([\d.]+)ms\)$/);
                if (m && Number(m[3]) > 8000) console.log(`LOAD ${process.argv[1]} pass ${process.argv[2]} SLOW ${Math.round(m[3])}ms ${m[1]} ${m[2].slice(0, 110)}`);
              }
              for (const l of t.split("\n")) if (/^ℹ (tests|pass|fail|duration_ms) /.test(l)) console.log(`LOAD ${process.argv[1]} pass ${process.argv[2]} ${l}`);
            ' "${{ matrix.load }}" "$i"
          done
