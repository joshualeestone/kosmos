name: linux-systemd

# #4918: the live systemd keep-alive check on ubuntu-latest. Runs on main and on PRs that touch what it tests.
on:
  push:
    branches: ["main"]
    paths:
      - "engine/linux*.js"
      - "engine/boardrestart.js"
      - "engine/create.js"
      - "engine/remove.js"
      - "engine/delete-leftover.js"
      - "engine/launchidentity.js"
      - "engine/accountenv.js"
      - "engine/live-execution.js"
      - "engine/worldstarts.js"
      - "engine/register.js"
      - "engine/status.js"
      - "engine/teamseed.js"
      - "engine/createdroster.js"
      - "engine/*linux*.test.js"
      - "tools/test-board-*.sh"
      - "install/kosmos"
      - "bin/agent-supervisor.sh"
      - "tools/test-linux-systemd-live-4918.sh"
      - "tools/test-linux-pause-check-live-6667.sh"
      - "tools/test-board-supervised-linux-4918.sh"
      - ".github/workflows/linux-systemd.yml"
  pull_request:
    paths:
      - "engine/linux*.js"
      - "engine/boardrestart.js"
      - "engine/create.js"
      - "engine/remove.js"
      - "engine/delete-leftover.js"
      - "engine/launchidentity.js"
      - "engine/accountenv.js"
      - "engine/live-execution.js"
      - "engine/worldstarts.js"
      - "engine/register.js"
      - "engine/status.js"
      - "engine/teamseed.js"
      - "engine/createdroster.js"
      - "engine/*linux*.test.js"
      - "tools/test-board-*.sh"
      - "install/kosmos"
      - "bin/agent-supervisor.sh"
      - "tools/test-linux-systemd-live-4918.sh"
      - "tools/test-linux-pause-check-live-6667.sh"
      - "tools/test-board-supervised-linux-4918.sh"
      - ".github/workflows/linux-systemd.yml"

permissions:
  contents: read

concurrency:
  group: linux-systemd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# kosmos#6742: dead-address the install "created" ping so CI never records a real
# install. A board started here reads this at ping time (engine/createdbeacon.js), and
# engine/linuxboard.js injects it into a systemd board unit, so the POST goes to
# loopback:9 instead of installkosmos.com. Guarded by tools/test-ci-created-url-6742.sh.
env:
  AGENT_WORKFORCE_CREATED_URL: http://127.0.0.1:9/api/created

jobs:
  systemd-keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: install tmux and systemd tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux systemd libpam-systemd >/dev/null
          tmux -V
      - name: enable linger and setup user session
        run: |
          sudo loginctl enable-linger "$USER"
          U="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$U"
          echo "XDG_RUNTIME_DIR=/run/user/$U" >> "$GITHUB_ENV"
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown "$U:$U" "$XDG_RUNTIME_DIR"
          sudo chmod 700 "$XDG_RUNTIME_DIR"
          for i in $(seq 1 15); do
            if systemctl --user is-system-running >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "systemctl --user status: $(systemctl --user is-system-running 2>&1 || true)"
      - name: run unit test suite
        run: |
          node --test engine/linuxjob.test.js engine/linuxboard.test.js engine/linuxboard.pausecheck-6667.test.js engine/boardrestart.linux-4918.test.js engine/create.tmux-linux-4917.test.js engine/linuxwiring-4918.test.js engine/create.linux-4918.test.js
          bash tools/test-board-supervised-detect-2956.sh
          bash tools/test-board-supervised-linux-4918.sh
          bash tools/test-board-foreground-2956.sh
          bash tools/test-board-revive-6667.sh
      - name: run live systemd user unit integration tests
        run: |
          bash tools/test-linux-systemd-live-4918.sh
      # kosmos#6667: a killed update's pause clears by itself and the board comes back; a person's stop holds. Waits on
      # the real minutely timer (up to about 3 minutes), so it measures what a Linux install does unattended.
      - name: run live pause check test (kosmos#6667)
        run: |
          bash tools/test-linux-pause-check-live-6667.sh
