# kosmos#8378 MEASUREMENT ONLY. This branch is NEVER merged and has no PR; a push to it runs this. Every other workflow is removed in this
# branch so it uses no fleet runner; this one runs the candidate test files on GitHub's Windows runner, 8 shards.
name: wincand-8378
on:
  push:
    branches: ["wincl3-8378-never-merge"]
permissions:
  contents: read
jobs:
  candidates:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      AGENT_WORKFORCE_CREATED_URL: http://127.0.0.1:9/api/created
    steps:
      - name: keep LF line endings, as shipped
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: candidates, shard ${{ matrix.shard }} of 8
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: '8'
          WINCAND_LIST: tools/wincand-8378-list.txt
          WINCAND_DETAIL: '30000'
        run: node tools/wincand-8378.js
  linux-container:
    # kosmos#9268 MEASUREMENT ONLY: securewrite's tests inside a container, whose root is an overlay file system.
    runs-on: ubuntu-latest
    container: node:26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: what file system holds the temp folder
        run: df -T /tmp || true; cat /proc/mounts | grep ' / ' || true
      - name: securewrite and trust tests
        run: node --test engine/securewrite.test.js engine/trust.test.js
