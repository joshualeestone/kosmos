# TEMP (#4317): time each test:shell command, and the node part, on the CI runner. Removed before the PR.
name: probe-4317
on:
  push:
    branches: ["shard-4317"]
permissions:
  contents: read
jobs:
  csp:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: cut-sign-preflight three ways
        run: |
          set +e; set +e; echo "== bare"; bash tools/test-cut-sign-preflight.sh < /dev/null > a.txt 2>&1; echo "rc=$?"; grep -E "FAIL|passed" a.txt | head -8; tail -5 a.txt
          echo "== yarn-like (sh -c)"; sh -c 'bash tools/test-cut-sign-preflight.sh' < /dev/null > b.txt 2>&1; echo "rc=$?"; grep -E "FAIL|passed" b.txt | head -8
          echo "== short TMPDIR"; mkdir -p "$TMPDIR/kt1"; TMPDIR="$TMPDIR/kt1" bash tools/test-cut-sign-preflight.sh < /dev/null > c.txt 2>&1; echo "rc=$?"; grep -E "FAIL|passed" c.txt | head -8
