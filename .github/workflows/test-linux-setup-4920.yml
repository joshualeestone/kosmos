# Linux setup verification (#4920 under #4916).
#
# Validates that install/setup.sh runs successfully on a clean Ubuntu runner:
# - Detects Linux and machine architecture
# - Discovers or installs tmux without interactive prompts
# - Symlinks system node into the runtime directory
# - Installs the board's systemd user unit through piece B's engine/linuxboard.js (one unit, not a shell copy)
#   and enables lingering
# - Starts the board and verifies HTTP 200 response on the board port
# - Successfully stops, restarts, and uninstalls cleanly

name: linux-setup

on:
  pull_request:
  # Run by hand on a branch (gh workflow run test-linux-setup-4920.yml --ref <branch>) without opening a PR, so the
  # real-systemd check does not also queue the Mac suite.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-setup-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-linux-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax and static installer guards
        run: |
          sh -n install/setup.sh
          bash -n install/setup.sh
          bash tools/test-installer-runnable-guard.sh
          bash tools/test-plist-heredoc-clean.sh
          bash tools/test-install-static.sh
          bash tools/test-install-static-control-4641.sh

      - name: Prepare systemd user environment
        run: |
          sudo loginctl enable-linger "$USER" || true
          sudo systemctl start user@"$(id -u)".service || true
          mkdir -p "/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "KOSMOS_PORT=16180" >> "$GITHUB_ENV"
          echo "KOSMOS_NO_OPEN=1" >> "$GITHUB_ENV"

      - name: Stage this checkout as the bundle setup.sh installs
        # The published bundle is the LAST release, so it does not carry this branch's engine (setup.sh's Linux step
        # requires app/engine/linuxboard.js, measured: run 37592812752 said "Cannot find module"). Stage the same file
        # list tools/build-kosmos-bundle.sh packs (that script is Mac-only: codesign, lipo, the native app), and
        # install it through setup.sh's local-copy path (KOSMOS_SRC). runtime/ is left out: on Linux setup.sh links
        # the system node when the bundled one cannot run, as it does for the published bundle.
        run: |
          SRC="$RUNNER_TEMP/kosmos-src"
          mkdir -p "$SRC/bin" "$SRC/app/engine" "$SRC/app/bin"
          cp server.js package.json "$SRC/app/"
          for f in engine/*.js; do case "$f" in *.test.js) ;; *) cp "$f" "$SRC/app/engine/" ;; esac; done
          cp -R web "$SRC/app/web"
          cp bin/agent-supervisor.sh bin/board-watchdog.sh bin/codex-report-bridge.js bin/gemini-report-bridge.js \
             bin/grok-report-bridge.js bin/agy-report-bridge.js "$SRC/app/bin/"
          chmod +x "$SRC/app/bin/"*
          V="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)"
          sed -i "s/__KOSMOS_VERSION__/$V/" "$SRC/app/web/index.html"
          cp install/kosmos-report-hook.sh "$SRC/app/bin/kosmos-report-hook.sh"
          cp install/kosmos "$SRC/bin/kosmos"
          chmod +x "$SRC/bin/kosmos"
          test -f "$SRC/app/engine/linuxboard.js"
          echo "KOSMOS_SRC=$SRC" >> "$GITHUB_ENV"

      - name: Execute install/setup.sh
        # sh, not bash: people run curl ... | sh, and on Ubuntu sh is dash, so the installer is tested in the shell it
        # really meets (the bash 3.2 parse is covered on the Mac by install.linux-board-4920.test.js).
        run: |
          sh install/setup.sh

      - name: Verify installed pieces
        run: |
          KOSMOS_HOME="$HOME/.local/share/kosmos"
          test -f "$KOSMOS_HOME/bin/kosmos" && test -x "$KOSMOS_HOME/bin/kosmos"
          test -f "$KOSMOS_HOME/tmux/bin/tmux" && test -x "$KOSMOS_HOME/tmux/bin/tmux"
          test -f "$KOSMOS_HOME/runtime/bin/node" && test -x "$KOSMOS_HOME/runtime/bin/node"
          "$KOSMOS_HOME/runtime/bin/node" --version

          # #4920: the unit is piece B's (engine/linuxboard.js boardUnitFor), written by installBoard. grep -F: the
          # values are literal text, and the unit quotes them.
          UNIT_FILE="$HOME/.config/systemd/user/kosmos-board.service"
          test -f "$UNIT_FILE"
          cat "$UNIT_FILE"
          grep -qF "Description=Kosmos Board" "$UNIT_FILE"
          grep -qF "ConditionPathExists=!$KOSMOS_HOME/board.stopped" "$UNIT_FILE"
          grep -qF "ExecStart=/bin/bash \"$KOSMOS_HOME/bin/kosmos\" board-run" "$UNIT_FILE"
          grep -qF "Environment=\"KOSMOS_HOME=$KOSMOS_HOME\"" "$UNIT_FILE"
          grep -qF "WorkingDirectory=$KOSMOS_HOME" "$UNIT_FILE"
          # What B's unit has and the old shell copy did not:
          grep -qxF "Restart=on-failure" "$UNIT_FILE"
          grep -qxF "KillMode=process" "$UNIT_FILE"
          if grep -qxF "Restart=always" "$UNIT_FILE"; then echo "FAIL: Restart=always restarts a stopped board" >&2; exit 1; fi
          systemctl --user is-enabled kosmos-board.service
          # setup.sh hands the running board to systemd (kosmos restart after installBoard), as the Mac does to launchd.
          test "$(systemctl --user is-active kosmos-board.service)" = active

      - name: Verify board responsiveness
        run: |
          KOSMOS_HOME="$HOME/.local/share/kosmos"
          "$KOSMOS_HOME/bin/kosmos" status
          curl -fsS -m 5 http://127.0.0.1:16180/ >/dev/null

      - name: Test stop and restart
        run: |
          KOSMOS_HOME="$HOME/.local/share/kosmos"
          # kosmos stop and start through systemd (setup.sh handed the board to it; asserted after install).
          "$KOSMOS_HOME/bin/kosmos" stop
          if curl -fsS -m 2 http://127.0.0.1:16180/ >/dev/null 2>&1; then echo "FAIL: board responding after stop" >&2; exit 1; fi
          "$KOSMOS_HOME/bin/kosmos" start
          curl -fsS -m 5 http://127.0.0.1:16180/ >/dev/null
          test "$(systemctl --user is-active kosmos-board.service)" = active

      - name: A board that exits while stopped is not restarted (#4918's loop)
        run: |
          # The #4918 loop, reproduced: with board.stopped present the board's own exit is clean, and Restart=always
          # restarted it every RestartSec (board-run then exited 0 at once, forever). kosmos stop cannot show this: its
          # systemctl stop cancels any pending restart. So: mark stopped, end the board with a plain TERM (not through
          # systemd), wait two restart windows, and require systemd restarted it zero times. A TERM exit is clean
          # (SuccessExitStatus=143), so this fails on Restart=always (any exit restarts), the regression it names.
          KOSMOS_HOME="$HOME/.local/share/kosmos"
          PID="$(systemctl --user show -p MainPID --value kosmos-board.service)"
          test -n "$PID" && test "$PID" != 0
          BEFORE="$(systemctl --user show -p NRestarts --value kosmos-board.service)"
          touch "$KOSMOS_HOME/board.stopped"
          kill -TERM "$PID"
          sleep 12   # RestartSec=5 in B's unit (engine/linuxboard.js): two restart windows
          AFTER="$(systemctl --user show -p NRestarts --value kosmos-board.service)"
          echo "NRestarts before=$BEFORE after=$AFTER"
          test -n "$BEFORE" && test -n "$AFTER" || { echo "FAIL: systemd did not report NRestarts, so this check would test nothing" >&2; exit 1; }
          test "$AFTER" = "$BEFORE" || { echo "FAIL: systemd restarted a board that exited while stopped" >&2; exit 1; }
          if [ "$(systemctl --user is-active kosmos-board.service 2>/dev/null)" = active ]; then echo "FAIL: board active while stopped" >&2; exit 1; fi
          rm -f "$KOSMOS_HOME/board.stopped"
          "$KOSMOS_HOME/bin/kosmos" start
          curl -fsS -m 5 http://127.0.0.1:16180/ >/dev/null

      - name: Test uninstall
        run: |
          sh install/setup.sh --uninstall
          UNIT_FILE="$HOME/.config/systemd/user/kosmos-board.service"
          test ! -f "$UNIT_FILE"
          # The enable link is what a failed disable leaves behind (the file is deleted either way).
          test ! -e "$HOME/.config/systemd/user/default.target.wants/kosmos-board.service"

      - name: Test custom KOSMOS_HOME unit derivation
        run: |
          CUSTOM_HOME="$HOME/custom-kosmos"
          AGENT_WORKFORCE_DATA="$CUSTOM_HOME/data" KOSMOS_HOME="$CUSTOM_HOME" sh install/setup.sh
          # B's name rule: sha256 of the resolved path, first 8 hex (CUSTOM_HOME is already absolute and clean).
          HASH=$(printf '%s' "$CUSTOM_HOME" | sha256sum | cut -c1-8)
          UNIT_FILE="$HOME/.config/systemd/user/kosmos-board.${HASH}.service"
          test -f "$UNIT_FILE"
          grep -qF "Environment=\"KOSMOS_HOME=$CUSTOM_HOME\"" "$UNIT_FILE"
          AGENT_WORKFORCE_DATA="$CUSTOM_HOME/data" KOSMOS_HOME="$CUSTOM_HOME" sh install/setup.sh --uninstall
          test ! -f "$UNIT_FILE"
          test ! -e "$HOME/.config/systemd/user/default.target.wants/kosmos-board.${HASH}.service"
