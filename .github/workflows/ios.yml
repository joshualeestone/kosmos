# iOS CI (#718). Runs the iOS logic tests (ios/LogicTests) and compiles the
# app against the simulator SDK, so a change to the origin gate, the session
# handling, the register/unregister rules or the notification categories goes red here instead of only on
# whoever remembers to run ios/LogicTests/run.sh by hand.
#
# ADVISORY, like android.yml and test.yml: nothing here blocks a merge (no branch
# protection on this repo, by a deliberate repo-admin decision; see test.yml).
#
# WHAT GREEN CERTIFIES: the UIKit-free logic (ios/LogicTests/run.sh lists the
# files) passes its suite on macOS,
# the app compiles and links for the simulator with signing off (Debug and
# Release), both built apps carry the four permission strings, the app icon and
# the navy launch screen (#4089), an unsigned device archive builds, the
# exported-app push check can fail as well as pass, archive.sh's signing
# settings checks refuse what they should, neither the Release app nor the
# archive carries the App Store screenshot switch (a Release build WITH it is the
# control that must fail, #6262), and the hand-signing mode's export options and
# archive arguments are right (with a stand-in xcodebuild). It does NOT certify running
# on a simulator or device, a signed build or export, or APNs delivery.
#
# The asset catalog (icon, launch colour) only compiles on a Mac with an iOS
# simulator runtime installed. The runner has one, so this workflow is where the
# icon and launch screen are proven (#4089).

name: ios

# Path-filtered like android.yml: safe because this is advisory, not required.
on:
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

# #4021: never on main, the same as test.yml (see its note): a merge must not cancel main's
# running build, or a red main is never reported. A PR's superseded run is still cancelled.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# kosmos#6742: dead-address the install "created" ping so CI never records a real
# install. A board started here reads this at ping time (engine/createdbeacon.js), and
# engine/linuxboard.js injects it into a systemd board unit, so the POST goes to
# loopback:9 instead of installkosmos.com. Guarded by tools/test-ci-created-url-6742.sh.
env:
  AGENT_WORKFORCE_CREATED_URL: http://127.0.0.1:9/api/created

jobs:
  build:
    name: logic tests + simulator build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun simctl list runtimes

      # The suite prints one VERDICT line last. Assert that line, not only the exit
      # code, so a run cut off before it cannot read as green.
      - name: Push bridge logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run.sh | tee "$RUNNER_TEMP/logic.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/logic.log"

      # -target with an unversioned -sdk: needs no installed simulator runtime
      # (see ios/README.md for why -scheme/-destination is not used).
      - name: Simulator SDK build
        working-directory: ios
        run: |
          xcodebuild -project Kosmos.xcodeproj -target Kosmos -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

      # iOS closes the app when a feature is used without its permission string;
      # check the strings in the apps just built, not the project file. Release is
      # built too because the store build is Release and the strings are set per
      # configuration, so a key dropped from Release alone would pass a Debug-only check.
      - name: Permission strings are in the built app (Debug and Release)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Kosmos.xcodeproj -target Kosmos -sdk iphonesimulator \
            -configuration Release CODE_SIGNING_ALLOWED=NO build
          for config in Debug Release; do
            tools/check-usage-strings.sh "build/$config-iphonesimulator/Kosmos.app/Info.plist" | tee "$RUNNER_TEMP/usage-$config.log"
            grep -q '^VERDICT: PASS' "$RUNNER_TEMP/usage-$config.log"
          done

      # #4089: App Store Connect refuses an upload with no icon. Check the apps just built.
      - name: App icon and launch screen are in the built app (Debug and Release)
        working-directory: ios
        run: |
          set -o pipefail
          for config in Debug Release; do
            tools/check-app-assets.sh "build/$config-iphonesimulator/Kosmos.app" | tee "$RUNNER_TEMP/assets-$config.log"
            grep -q '^VERDICT: PASS' "$RUNNER_TEMP/assets-$config.log"
          done

      # #4089: the archive command tools/archive.sh runs (less its team and bundle id settings), with signing off, so a
      # project change that breaks archiving goes red before the day of the first upload.
      - name: Device archive builds (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project Kosmos.xcodeproj -scheme Kosmos -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kosmos.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          test -d "$RUNNER_TEMP/Kosmos.xcarchive/Products/Applications/Kosmos.app"
          # kosmos#6487: the notification extension rides inside the app, under its own bundle id.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Kosmos.xcarchive/Products/Applications/Kosmos.app/PlugIns/KosmosNotice.appex/Info.plist")" = io.kosmos.app.notice

      # #6262: the store build never carries the App Store screenshot switch (ios/store/shoot-app.sh's
      # KOSMOS_STORE_SHOTS). Checked on the Release app and the archive's app, and shown able to fail on a REAL
      # Release build made with the switch (the configuration that ships, optimised), so a renamed or inlined marker
      # cannot make the check pass by finding nothing.
      # (archive.sh runs the same check on the exported .ipa before upload, inside check-ipa-entitlements.sh.)
      - name: No screenshot switch in the store build
        run: |
          set -o pipefail
          for app in ios/build/Release-iphonesimulator/Kosmos.app "$RUNNER_TEMP/Kosmos.xcarchive/Products/Applications/Kosmos.app"; do
            ios/tools/check-no-shots-flag.sh "$app" | tee "$RUNNER_TEMP/shots-flag.log"
            grep -q '^VERDICT: PASS' "$RUNNER_TEMP/shots-flag.log"
          done
          xcodebuild -project ios/Kosmos.xcodeproj -target Kosmos -sdk iphonesimulator -configuration Release \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$RUNNER_TEMP/shots-sym" OBJROOT="$RUNNER_TEMP/shots-obj" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=KOSMOS_STORE_SHOTS' build
          if ios/tools/check-no-shots-flag.sh "$RUNNER_TEMP/shots-sym/Release-iphonesimulator/Kosmos.app" > "$RUNNER_TEMP/shots-ctl.log"; then
            echo "the check passed an app built with the switch"; exit 1
          fi
          # The found-it line, not the bare verdict: a missing executable also fails, and would prove nothing.
          grep -q 'was built with KOSMOS_STORE_SHOTS' "$RUNNER_TEMP/shots-ctl.log"

      # #4089: the check archive.sh runs before any upload, shown able to fail.
      - name: Exported-app push check (production aps-environment)
        run: |
          set -o pipefail
          ios/tools/test-check-ipa-entitlements.sh | tee "$RUNNER_TEMP/ipa-check.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/ipa-check.log"

      # #4089, #6262: archive.sh's signing settings checks, including that io.kosmos.app is built only under
      # Kosmos Agent Manager, Inc.'s team, and the hand-signing mode (export-options.sh and archive.sh's wiring).
      - name: Archive signing settings refuse what they should
        run: |
          set -o pipefail
          ios/tools/test-archive-config.sh | tee "$RUNNER_TEMP/archive-config.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/archive-config.log"
