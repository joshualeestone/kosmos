# iOS CI (#718). Runs the iOS logic tests (ios/LogicTests) and compiles the
# app against the simulator SDK, so a change to the origin gate, the session
# handling, the register/unregister rules or the notification categories goes red here instead of only on
# whoever remembers to run ios/LogicTests/run.sh by hand.
#
# ADVISORY, like android.yml and test.yml: nothing here blocks a merge (no branch
# protection on this repo, by a deliberate repo-admin decision; see test.yml).
#
# WHAT GREEN CERTIFIES: the UIKit-free logic (ios/LogicTests/run.sh lists the
# files) passes its suite on macOS,
# the app compiles and links for the simulator with signing off (Debug and
# Release), both built apps carry the four permission strings, the app icon and
# the launch screen (#4089, #7945), an unsigned device archive builds, the
# exported-app push check can fail as well as pass, archive.sh's signing
# settings checks refuse what they should, neither the Release app nor the
# archive carries the App Store screenshot switch (a Release build WITH it is the
# control that must fail, #6262), and the hand-signing mode's export options and
# archive arguments are right (with a stand-in xcodebuild). It does NOT certify running
# on a simulator or device, a signed build or export, or APNs delivery.
#
# The asset catalog (icon, launch colour) only compiles on a Mac with an iOS
# simulator runtime installed. The runner has one, so this workflow is where the
# icon and launch screen are proven (#4089).

name: ios

# Path-filtered like android.yml: safe because this is advisory, not required.
# kosmos#7084: the logic suites that read the board's own source (room, settings, tasks: web/index.html, engine/*.js)
# ALSO run in the board's node suite (ios.board-parity-7084.test.js) on any Mac, so every full validation catches a web
# or engine change that breaks one of their pins before it merges. Do not add web/ or engine/ here for that (#5488).
on:
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

# #4021: never on main, the same as test.yml (see its note): a merge must not cancel main's
# running build, or a red main is never reported. A PR's superseded run is still cancelled.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# kosmos#6742: dead-address the install "created" ping so CI never records a real
# install. A board started here reads this at ping time (engine/createdbeacon.js), and
# engine/linuxboard.js injects it into a systemd board unit, so the POST goes to
# loopback:9 instead of installkosmos.com. Guarded by tools/test-ci-created-url-6742.sh.
env:
  AGENT_WORKFORCE_CREATED_URL: http://127.0.0.1:9/api/created

jobs:
  # kosmos#8993: where `build` runs. Measured 11-24: every queued job was waiting for macos-latest (a main ios run waited
  # 2 h 41 min for one) while the repo's two self-hosted Macs (label kosmos-ci) sat idle. `build` (logic tests and
  # simulator SDK builds, no simulator booted, no artifact shared with the UI jobs) goes to the self-hosted Mac ONLY when
  # the repo variable KOSMOS_CI_IOS_JOBS names it ("build") AND test.yml's kill switch KOSMOS_CI_RUNNER is `on` AND the
  # code is this repo's own (a push to main, or a PR whose head is this repo), the same own-code rule as test.yml
  # (#5488); the machine's job guard (tools/ci-runner-job-guard.sh) is what refuses fork code. Anything else, the
  # variable unset included, is macos-latest, as before. The UI jobs stay on macos-latest: they share one build, a UI
  # job whose Xcode differs from the build's builds again (see uibuild), and both kosmos-ci runners are on one machine
  # (test.yml's #4601 note), so simulator runs there would compete for one Mac; measure `build` there first.
  # A change to either variable reaches a run's `build` only through a new route: "Re-run failed jobs" keeps the route
  # it had, so after switching off, use "Re-run all jobs". A routed job with no runner online waits in the queue (up to
  # GitHub's 24 hours), red to nobody, as test.yml's does. If route itself fails, build still runs, on macos-latest.
  # Pinned by tools/test-ci-ios-route-8993.sh.
  route:
    name: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_runner: ${{ steps.decide.outputs.build_runner }}
    steps:
      - id: decide
        name: where the logic build runs (KOSMOS_CI_IOS_JOBS)
        # Values arrive through env, never pasted into the script: a branch or repo name can hold shell syntax.
        env:
          CI_RUNNER: ${{ vars.KOSMOS_CI_RUNNER }}
          CI_IOS_JOBS: ${{ vars.KOSMOS_CI_IOS_JOBS }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          build='"macos-latest"'
          own=""
          if [ "$EVENT_NAME" = push ] || { [ "$EVENT_NAME" = pull_request ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" = "$THIS_REPO" ]; }; then
            own=1
          fi
          # Whole tokens only, split on commas and whitespace: "builds" or "xbuild" name nothing. set -f keeps a "*"
          # literal. Only the result is logged, never the variable, so the log line can carry no workflow command.
          set -f
          for tok in ${CI_IOS_JOBS//,/ }; do
            case "$tok" in
              build) if [ "$CI_RUNNER" = on ] && [ -n "$own" ]; then build='["self-hosted","macOS","arm64","kosmos-ci"]'; fi ;;
            esac
          done
          echo "build_runner=$build" >> "$GITHUB_OUTPUT"
          echo "logic build runs on: $build"

  build:
    name: logic tests + simulator build
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.route.outputs.build_runner || '"macos-latest"') }}
    # kosmos#9213: hosted macOS runners come in two speeds. On a slow one this job finished in 31-39 min or was
    # cancelled at the old 40, so its full length there was never seen. The logic tests now compile without the
    # optimizer (ios/LogicTests/run*.sh) and the limit is 55.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      # kosmos#8993: on the self-hosted Mac, check what the hosted image always has, so a machine that cannot build says
      # so in one plain line instead of failing somewhere inside xcodebuild.
      - name: The self-hosted Mac can build an iPhone app
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          fix="to send this job back to macos-latest, take build out of the repo variable KOSMOS_CI_IOS_JOBS (kosmos#8993)"
          xcodebuild -version > /dev/null 2>&1 || { echo "::error::no working full Xcode on this runner (xcodebuild -version failed); $fix"; exit 1; }
          xcodebuild -checkFirstLaunchStatus > /dev/null 2>&1 || { echo "::error::Xcode's first-launch setup or licence is not done on this runner; $fix"; exit 1; }
          xcrun simctl list runtimes 2>/dev/null | grep '^iOS ' | grep -vq unavailable || { echo "::error::no iOS simulator runtime on this runner (the asset catalog needs one); $fix"; exit 1; }
          echo "this runner has Xcode, its first-launch setup and an iOS simulator runtime"

      - name: Toolchain versions
        run: |
          echo "runner: $RUNNER_NAME ($RUNNER_ENVIRONMENT)"   # kosmos#8993: which Mac, for the queue measurements
          xcodebuild -version
          xcrun swiftc --version
          xcrun simctl list runtimes

      # The suite prints one VERDICT line last. Assert that line, not only the exit
      # code, so a run cut off before it cannot read as green.
      - name: Push bridge logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run.sh | tee "$RUNNER_TEMP/logic.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/logic.log"

      # kosmos#7010: the Settings tab's logic, its own suite so it and the chat slice never edit one test file.
      - name: Settings logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-settings.sh | tee "$RUNNER_TEMP/settings.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/settings.log"

      # kosmos#8959 slice B1a: the native Kosmos+ account screen, its own suite like Settings'.
      - name: Account logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-account.sh | tee "$RUNNER_TEMP/account.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/account.log"

      # kosmos#7017: answering from the notification, its own suite like Settings'.
      - name: Notification action logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-actions.sh | tee "$RUNNER_TEMP/actions.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/actions.log"

      # kosmos#7032: a project's room (slice 9), its own suite like the others.
      - name: Project room logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-room.sh | tee "$RUNNER_TEMP/room.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/room.log"

      # kosmos#7031: the Tasks tab's logic, its own suite like Settings'.
      - name: Tasks logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-tasks.sh | tee "$RUNNER_TEMP/tasks.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/tasks.log"

      # kosmos#7074: a task's native page, its own suite like the others.
      - name: Task page logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-taskpage.sh | tee "$RUNNER_TEMP/taskpage.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/taskpage.log"

      # kosmos#7078: the New task sheet's logic, its own suite like the Tasks tab's.
      - name: New task logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-newtask.sh | tee "$RUNNER_TEMP/newtask.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/newtask.log"

      # kosmos#7267: the agent page (Profile | AI Settings), its own suite like the others.
      - name: Agent page logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-agentinfo.sh | tee "$RUNNER_TEMP/agentinfo.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/agentinfo.log"

      # kosmos#7268: the composer's emoji button and dictation, its own suite like the others.
      - name: Composer extras logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-composer.sh | tee "$RUNNER_TEMP/composer.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/composer.log"

      # kosmos#7679: an agent's and a project's Files, its own suite like the others.
      - name: Files logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-files.sh | tee "$RUNNER_TEMP/files.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/files.log"

      # kosmos#7896: the KOSMOS orb's geometry (the loading mark), its own suite like the others.
      - name: Orb logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-orb.sh | tee "$RUNNER_TEMP/orb.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/orb.log"

      # kosmos#9091: Hop, the one-tap game under the offline screen (its rules, HopLogic.swift).
      - name: Hop logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-hop.sh | tee "$RUNNER_TEMP/hop.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/hop.log"

      # kosmos#7954: the board's Sweep loader (eight dots on a ring) on the first-connect wait, against the board's numbers.
      # kosmos#7945: it also checks the launch screen (the same ring) against the palette, that its PNGs are current, and
      # that the wait centres its ring on the screen where the launch screen draws it.
      - name: Sweep dots logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-sweep.sh | tee "$RUNNER_TEMP/sweep.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/sweep.log"

      # kosmos#8078: pull to refresh's decisions. Its gesture is DotsRefreshUITests, run by hand.
      - name: Pull to refresh logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-pullrefresh.sh | tee "$RUNNER_TEMP/pullrefresh.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/pullrefresh.log"

      # kosmos#8959 slice B1b: the account screen's second step (its state, the offer, the fresh session a confirm hands
      # back). Its words are compared with the web page only where kosmos-relay is checked out beside it (not on CI).
      - name: Account second step logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-accountsecond.sh | tee "$RUNNER_TEMP/accountsecond.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/accountsecond.log"

      # kosmos#8959 slice B1c: the account screen's passkeys (list, remove, add, and authData out of the attestation
      # object iOS hands back) and sign-ins from new places. Words compared with the web page only where kosmos-relay is
      # checked out beside it (not on CI).
      - name: Account passkeys and new places logic tests
        run: |
          set -o pipefail
          KOSMOS_RELAY= ios/LogicTests/run-accountsecurity.sh | tee "$RUNNER_TEMP/accountsecurity.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/accountsecurity.log"

      # kosmos#8959 slice D1a: the computer's Automation settings (each box's request, answer and refusal). Its words are
      # compared with web/index.html and its routes with server.js, both in this checkout.
      - name: Automation settings logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-automation.sh | tee "$RUNNER_TEMP/automation.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/automation.log"

      # kosmos#8959 slice D1b1: the computer's Global skills (list, add, remove), words compared with web/index.html.
      - name: Global skills logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-globalskills.sh | tee "$RUNNER_TEMP/globalskills.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/globalskills.log"

      # kosmos#8959 slice D1b2: the computer's AI policies (list, add, replace, rename, remove, who was told), words
      # compared with web/index.html.
      - name: AI policies logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-aipolicies.sh | tee "$RUNNER_TEMP/aipolicies.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/aipolicies.log"

      # kosmos#8959 slice C: deleting the account natively (the four routes' requests, every answer, the page's words).
      # Words compared with the web page only where kosmos-relay is checked out beside it (not on CI).
      - name: Delete account logic tests
        run: |
          set -o pipefail
          KOSMOS_RELAY= ios/LogicTests/run-deleteaccount.sh | tee "$RUNNER_TEMP/deleteaccount.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/deleteaccount.log"

      # kosmos#8959 slice D1c1: the computer's Updates (the card's arms, the install's wait and its verdicts, the
      # automatic-updates switch), words compared with web/index.html.
      - name: Updates logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-updates.sh | tee "$RUNNER_TEMP/updates.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/updates.log"

      # kosmos#8959 slice D1c2a: the computer's Token usage figures, against node's figures from web/index.html's own
      # usage functions, and its price table entry by entry.
      - name: Token usage logic tests
        run: |
          set -o pipefail
          ios/LogicTests/run-usage.sh | tee "$RUNNER_TEMP/usage.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/usage.log"

      # -target with an unversioned -sdk: needs no installed simulator runtime
      # (see ios/README.md for why -scheme/-destination is not used).
      - name: Simulator SDK build
        working-directory: ios
        run: |
          xcodebuild -project Kosmos.xcodeproj -target Kosmos -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

      # iOS closes the app when a feature is used without its permission string;
      # check the strings in the apps just built, not the project file. Release is
      # built too because the store build is Release and the strings are set per
      # configuration, so a key dropped from Release alone would pass a Debug-only check.
      - name: Permission strings are in the built app (Debug and Release)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Kosmos.xcodeproj -target Kosmos -sdk iphonesimulator \
            -configuration Release CODE_SIGNING_ALLOWED=NO build
          for config in Debug Release; do
            tools/check-usage-strings.sh "build/$config-iphonesimulator/Kosmos.app/Info.plist" | tee "$RUNNER_TEMP/usage-$config.log"
            grep -q '^VERDICT: PASS' "$RUNNER_TEMP/usage-$config.log"
          done

      # #4089: App Store Connect refuses an upload with no icon. Check the apps just built.
      - name: App icon and launch screen are in the built app (Debug and Release)
        working-directory: ios
        run: |
          set -o pipefail
          for config in Debug Release; do
            tools/check-app-assets.sh "build/$config-iphonesimulator/Kosmos.app" | tee "$RUNNER_TEMP/assets-$config.log"
            grep -q '^VERDICT: PASS' "$RUNNER_TEMP/assets-$config.log"
          done

      # #4089: the archive command tools/archive.sh runs (less its team and bundle id settings), with signing off, so a
      # project change that breaks archiving goes red before the day of the first upload.
      - name: Device archive builds (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project Kosmos.xcodeproj -scheme Kosmos -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kosmos.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/archive-dd" CODE_SIGNING_ALLOWED=NO archive
          # kosmos#8993: -derivedDataPath keeps the archive's build state in this job's temp folder. On the self-hosted
          # Mac the default (~/Library/Developer/Xcode/DerivedData) is reused across runs, so the archive would be an
          # incremental build of whatever the last run left, not the clean build a hosted runner makes.
          test -d "$RUNNER_TEMP/Kosmos.xcarchive/Products/Applications/Kosmos.app"
          # kosmos#6487: the notification extension rides inside the app, under its own bundle id.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Kosmos.xcarchive/Products/Applications/Kosmos.app/PlugIns/KosmosNotice.appex/Info.plist")" = io.kosmos.app.notice

      # #6262: the store build never carries the App Store screenshot switch (ios/store/shoot-app.sh's
      # KOSMOS_STORE_SHOTS). Checked on the Release app and the archive's app, and shown able to fail on a REAL
      # Release build made with the switch (the configuration that ships, optimised), so a renamed or inlined marker
      # cannot make the check pass by finding nothing.
      # (archive.sh runs the same check on the exported .ipa before upload, inside check-ipa-entitlements.sh.)
      - name: No screenshot switch in the store build
        run: |
          set -o pipefail
          for app in ios/build/Release-iphonesimulator/Kosmos.app "$RUNNER_TEMP/Kosmos.xcarchive/Products/Applications/Kosmos.app"; do
            ios/tools/check-no-shots-flag.sh "$app" | tee "$RUNNER_TEMP/shots-flag.log"
            grep -q '^VERDICT: PASS' "$RUNNER_TEMP/shots-flag.log"
          done
          xcodebuild -project ios/Kosmos.xcodeproj -target Kosmos -sdk iphonesimulator -configuration Release \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$RUNNER_TEMP/shots-sym" OBJROOT="$RUNNER_TEMP/shots-obj" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=KOSMOS_STORE_SHOTS' build
          if ios/tools/check-no-shots-flag.sh "$RUNNER_TEMP/shots-sym/Release-iphonesimulator/Kosmos.app" > "$RUNNER_TEMP/shots-ctl.log"; then
            echo "the check passed an app built with the switch"; exit 1
          fi
          # The found-it line, not the bare verdict: a missing executable also fails, and would prove nothing.
          grep -q 'was built with KOSMOS_STORE_SHOTS' "$RUNNER_TEMP/shots-ctl.log"

      # #4089: the check archive.sh runs before any upload, shown able to fail.
      - name: Exported-app push check (production aps-environment)
        run: |
          set -o pipefail
          ios/tools/test-check-ipa-entitlements.sh | tee "$RUNNER_TEMP/ipa-check.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/ipa-check.log"

      # #4089, #6262: archive.sh's signing settings checks, including that io.kosmos.app is built only under
      # Kosmos Agent Manager, Inc.'s team, and the hand-signing mode (export-options.sh and archive.sh's wiring).
      - name: Archive signing settings refuse what they should
        run: |
          set -o pipefail
          ios/tools/test-archive-config.sh | tee "$RUNNER_TEMP/archive-config.log"
          grep -q '^VERDICT: PASS' "$RUNNER_TEMP/archive-config.log"

      # kosmos#9213: the logic suites compile with -Onone. A branch started before that change can land a script with -O
      # after it, so this fails on any optimizer flag. Last in the job, so a stray flag never hides the suites above.
      - name: Logic tests compile without the optimizer
        run: ios/tools/check-logic-onone.sh

  # kosmos#8993: the app the three UI jobs test, built once per run. Each of them built the same Debug app itself, about 12
  # of a 40 minute job (measured on run 45384659475: 28.4 min of tests in a 40.5 min test action), on a macOS queue that
  # held runs for up to 114 minutes on 2026-11-24. They now test these products (ui-sample.sh --products), and a job whose
  # runner has another Xcode builds for itself, said in its log. If this job fails, the UI jobs do not run, and this red
  # is the run's red, with xcodebuild's last lines in its log: the UI jobs then show as skipped, which means NOT TESTED, not
  # green. A download that is missing, cut short or will not unpack falls back to building, with a warning on the run.
  # The cost, said plainly: the UI jobs ask for a runner only once this job is done, so on a congested macOS queue a run
  # waits for a runner twice. Fewer macOS minutes per run (two builds not made) should shorten the queue for everyone;
  # whether a run's own start-to-verdict time gets shorter is measured after merge (kosmos#8993), not assumed.
  uibuild:
    name: ui build (sample board)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the app for the UI tests
        run: |
          set -o pipefail
          ios/tools/ui-sample.sh --build-only "$RUNNER_TEMP/ui-products" | tee "$RUNNER_TEMP/ui-build.log"
          grep -q '^PASS  ui-sample build:' "$RUNNER_TEMP/ui-build.log"
          # One tar: an artifact drops file modes (the app's and the test runner's executables would lose +x) and links.
          # COPYFILE_DISABLE: no ._ AppleDouble entries, which inside an .app would break its signature's seal.
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP/ui-products" -cf "$RUNNER_TEMP/ui-products.tar" .
          # What the UI jobs will unpack must still be a signed, launchable app: check the round trip here, once.
          mkdir "$RUNNER_TEMP/ui-products-check"
          tar -C "$RUNNER_TEMP/ui-products-check" -xf "$RUNNER_TEMP/ui-products.tar"
          for app in "$RUNNER_TEMP"/ui-products-check/Debug-iphonesimulator/*.app; do
            codesign --verify --deep --strict "$app" || { echo "FAIL  the tarred $(basename "$app") does not verify"; exit 1; }
          done
          # The UI jobs check the download against this before unpacking it.
          ( cd "$RUNNER_TEMP" && shasum -a 256 ui-products.tar > ui-products.tar.sha256 )

      # Only this run's UI jobs read it. One name per run (artifacts belong to their run), overwritten by "Re-run all jobs",
      # so "Re-run failed jobs" on a UI job finds the products its run built. Kept 3 days for such a re-run; past that the
      # UI job builds the app itself (see its download step). Sample-board Debug app and test runner: no account, no secrets.
      # A failed upload is not a failed build: the UI jobs then find no shared build and build for themselves (with a warning).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ui-products
          path: |
            ${{ runner.temp }}/ui-products.tar
            ${{ runner.temp }}/ui-products.tar.sha256
          retention-days: 3
          overwrite: true
          compression-level: 0   # already one tar; zipping it again only costs the runner time
          if-no-files-found: error

  # kosmos#7609: the UI tests that need no account (sample agents, a Debug build) on a fresh simulator, so a change that
  # breaks the + panel, the room title, the keyboard keeping the newest message above the box (in a DM and in a long room,
  # #7690), or a long room opening on its newest post (#7654) goes red here instead of only when someone runs the UI
  # tests by hand. Beside the logic build, which it does not wait for; it waits for uibuild's products (kosmos#8993).
  # The runner's simulator is usually an older iOS than the one the tests were written on, which is a check in itself
  # (#7609 item 1). ui-sample.sh passes only when every expected test ran (a filter matching nothing also exits 0).
  ui:
    name: ui tests (sample board)
    needs: uibuild
    runs-on: macos-latest
    # kosmos#9075: a passing run takes about 45 minutes on a hosted runner, so 50 cancelled passing runs; split the job later.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # kosmos#8993: the run's shared build. If it cannot be had (expired, say), ui-sample.sh builds the app itself.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ui-products
          path: ${{ runner.temp }}/ui-products-tar
      # Only a download that matches uibuild's checksum and unpacks whole is used; anything else (expired, cut short by the
      # network) leaves the folder empty, and ui-sample.sh builds the app itself, with this warning on the run.
      - name: Unpack the shared build
        run: |
          mkdir -p "$RUNNER_TEMP/ui-products"
          d="$RUNNER_TEMP/ui-products-tar"
          if [ -f "$d/ui-products.tar" ] && [ -f "$d/ui-products.tar.sha256" ] && ( cd "$d" && shasum -a 256 -c ui-products.tar.sha256 ) &&
             tar -C "$RUNNER_TEMP/ui-products" -xf "$d/ui-products.tar"; then
            echo "using the shared build"
          else
            rm -rf "${RUNNER_TEMP:?}/ui-products"; mkdir -p "$RUNNER_TEMP/ui-products"
            echo "::warning::no usable shared build for this run (missing, or not matching uibuild's checksum), so this job builds the app itself"
          fi

      - name: UI tests (sample board)
        run: |
          set -o pipefail
          UI_SAMPLE_FAILED_RESULT="$RUNNER_TEMP/ui-result.xcresult" ios/tools/ui-sample.sh --products "$RUNNER_TEMP/ui-products" | tee "$RUNNER_TEMP/ui-sample.log"
          grep -q '^PASS  ui-sample:' "$RUNNER_TEMP/ui-sample.log"

      # kosmos#7609: three reds on main in a day left nothing to read. Sample data only: no account, no real messages.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-result-${{ github.run_id }}-${{ github.run_attempt }}
          # The wildcard keeps the .xcresult folder in the zip; an exact path puts its contents at the top.
          path: ${{ runner.temp }}/ui-result*
          retention-days: 7

  # kosmos#8221: the same sample-board run on the UIKit chat list (ui-sample.sh --uikit), which a release build does not draw
  # yet, so a change that breaks it goes red here before the slice that lets a phone choose it. Its own job, beside the
  # lazy list's, so neither waits on the other. ui-flaky-count.sh reads a job by its exact name: pass this one's to count it.
  # kosmos#8221 slice 14: 60 minutes, from 50. Passing runs took 31 to 36 minutes on main and up to 41 on a PR; a main run
  # on 2026-11-10 07:22 UTC reached its summary at about 50 because a flaky check was retried (-retry-tests-on-failure),
  # and was cancelled in its cleanup. Slice 14 adds two checks on the 260-message chat; two attempts of its first run were
  # cancelled at 50 with nothing printed. ui-sample.sh now stops any one test on this list at 7 minutes (14 with its retry),
  # so one hang fails as a test rather than reaching this limit.
  # kosmos#8221 slice 16: 80 minutes, from 60. Passing runs took 46 to 52 minutes on main and other PRs on 2026-11-10 (one
  # outlier at 29); slice 16 adds four checks of about 1.5 to 2 minutes each, and its first run was cancelled at 60 with
  # the per-test limit never reached (no test hung).
  # kosmos#8453: in two halves (ui-sample.sh --shard), as one job took 75 of its 80 minutes on PR #8447 and a slow runner
  # would have timed it out, a red no PR caused. Each half ran about half the checks (and, until #8993, built the app itself)
  # (measured per class: about 27 and 26 minutes of checks, before #8443's longer page delay; with the build, an estimated
  # 45 to 55 minutes each). The limit stays 75 until a run measures the halves: a job stopped at its limit is cancelled, not
  # failed, so its result bundle is never uploaded and its TIMED OUT lines never print, and one hung test costs up to 14
  # minutes. Lower it once runs show the room. A half that fails does not cancel the other (fail-fast off).
  uikit:
    name: uikit list (sample board) ${{ matrix.shard }}
    needs: uibuild
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4

      # kosmos#8993: the run's shared build. If it cannot be had (expired, say), ui-sample.sh builds the app itself.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ui-products
          path: ${{ runner.temp }}/ui-products-tar
      # Only a download that matches uibuild's checksum and unpacks whole is used; anything else (expired, cut short by the
      # network) leaves the folder empty, and ui-sample.sh builds the app itself, with this warning on the run.
      - name: Unpack the shared build
        run: |
          mkdir -p "$RUNNER_TEMP/ui-products"
          d="$RUNNER_TEMP/ui-products-tar"
          if [ -f "$d/ui-products.tar" ] && [ -f "$d/ui-products.tar.sha256" ] && ( cd "$d" && shasum -a 256 -c ui-products.tar.sha256 ) &&
             tar -C "$RUNNER_TEMP/ui-products" -xf "$d/ui-products.tar"; then
            echo "using the shared build"
          else
            rm -rf "${RUNNER_TEMP:?}/ui-products"; mkdir -p "$RUNNER_TEMP/ui-products"
            echo "::warning::no usable shared build for this run (missing, or not matching uibuild's checksum), so this job builds the app itself"
          fi

      - name: UI tests on the UIKit list (sample board)
        run: |
          set -o pipefail
          UI_SAMPLE_FAILED_RESULT="$RUNNER_TEMP/uikit-result.xcresult" ios/tools/ui-sample.sh --uikit --shard "${{ matrix.shard }}" --products "$RUNNER_TEMP/ui-products" | tee "$RUNNER_TEMP/ui-sample.log"
          grep -q '^PASS  ui-sample:' "$RUNNER_TEMP/ui-sample.log"

      # Sample data only: no account, no real messages. Named per half (no slash in an artifact name), so two cannot clash.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: uikit-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/uikit-result*
          retention-days: 7
