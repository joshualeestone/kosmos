# #9262 MEASUREMENT ONLY, on branch angel-9262b-never-merge (never merged, no PR).
name: ftw9262b
on:
  push:
    branches: ["angel-9262b-never-merge"]
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: each file with the helper, fake-tmux skips off
        shell: bash
        run: |
          set +e
          for f in $(cat .github/ftw9262b-files.txt); do
            timeout 300 node --test --test-timeout=60000 "$f" > out.txt 2>&1; rc=$?
            echo "=== $f rc=$rc $(grep -E '^ℹ (pass|fail|skipped)' out.txt | tr '\n' ' ')"
            sed -n '/failing tests:/,$p' out.txt | grep -E '^test at|^✖|AssertionError|Error:|message|expected|actual|^  +[a-z]' | head -80 | cut -c1-300
          done
