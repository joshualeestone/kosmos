# Android build CI (#718). Closes the gap android/README.md flagged: "Android CI
# is not wired today; when it is, the runner's JDK-21 provisioning is the piece to
# add." This wires exactly that.
#
# 🛑 WHAT THIS IS AND IS NOT. Like `test.yml`, this is ADVISORY: nothing here blocks
# a merge, because a merge is server-side and no workflow gates it without branch
# protection with a required check. Branch protection was deliberately NOT enabled
# on this repo (see test.yml's header: it gates every merge for the whole roster and
# fights the "merge fast" posture, and `gh pr merge --admin` bypasses it anyway).
# Making THIS a required status check is the same repo-admin decision, deliberately
# left to a human. So this is a second, visible signal the create-pr CI-watch already
# honors, not a gate.
#
# WHAT GREEN CERTIFIES: the TWA skeleton still configures and assembles a debug APK
# under a clean JDK-21 toolchain. It does NOT certify a signed release (that is the
# conditional job below, inert until signing secrets exist), the Play listing, or
# behavior on a device.
#
# JDK-21 PROVISIONING (the piece the README flagged). The module's daemon-JVM
# criteria (toolchainVersion=21 in gradle/gradle-daemon-jvm.properties) need a JDK 21
# on the runner. actions/setup-java@v4 installs it and sets JAVA_HOME, and Gradle
# auto-detects JAVA_HOME to satisfy the criteria -- that is the load-bearing
# mechanism (verified locally: with org.gradle.java.installations.paths pointed at a
# nonexistent path, a JDK-21 JAVA_HOME still builds green). android/gradle.properties
# ALSO pins installations.paths at this fleet box's keg path, which does not exist on
# a runner; every gradle call below passes -Dorg.gradle.java.installations.paths=
# "$JAVA_HOME" to replace that dead path with the runner's JDK 21, so it is never a
# stale entry. The -D is defensive redundancy on top of JAVA_HOME, not the mechanism.

name: android

# Only run when the Android module (or this workflow) changes. The rest of the repo
# is a macOS node app whose android/ dir is an isolated Gradle project, so a node-only
# PR should not pay for an Android build. Path-filtering is safe here precisely because
# this is advisory, not a required check: a required check that is path-filtered can
# wedge PRs that never trigger it ("expected but never ran"), but an advisory one cannot.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

# Least privilege: this job only reads the repo and builds. It needs no write scope.
# Uses pull_request (not pull_request_target), so untrusted PR code never runs with
# elevated access or sees repo secrets on a fork PR.
permissions:
  contents: read

# Cancel a superseded run of the same event+ref (a rapid re-push / PR sync) instead of
# queuing a redundant build. Mirrors test.yml; the push/PR pair still lands in separate
# groups (refs/heads/... vs refs/pull/N/merge), an accepted harmless double-run.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug (+ conditional signed release)
    # ubuntu, NOT macos. Unlike test.yml's node suite (which makes macOS-specific
    # assumptions), an Android Gradle build is platform-independent JVM tooling: JDK +
    # Android SDK, no native macOS dependency (this is the Android shell, not iOS).
    # ubuntu-latest is the Android-CI norm and ships the Android SDK. If a genuine
    # platform issue ever surfaces here, macos-latest is the documented fallback.
    runs-on: ubuntu-latest
    # The debug build is ~seconds; bound a hung run well under the 360-min default.
    timeout-minutes: 20
    # A boolean PRESENCE FLAG, not the secret value: `secrets.X != ''` evaluates to the
    # string 'true'/'false' at env-resolution time, so the keystore material itself never
    # enters this job-level env (and so never reaches the debug step's environment). The
    # actual signing secrets are scoped to the conditional release step below. NOTE: the
    # secrets are intentionally NOT provisioned by this PR -- adding signing material to
    # GitHub Actions secrets is a repo-admin decision surfaced to the repo owner, not an
    # autonomous one. This workflow only wires the conditional; with no secret, the flag
    # is 'false' and the release step is skipped.
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.KOSMOS_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Provision JDK 21 (Temurin). Sets JAVA_HOME to the runner's JDK 21, which both
      # satisfies the daemon-JVM criteria (via auto-detection) and is fed to the -D
      # override below (see the JDK-21 note in the header).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Provision the Android SDK + accept licenses. AGP (compileSdk 35, build-tools
      # 35.0.0) auto-downloads the platform/build-tools it needs against this.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Legibility: surface the toolchain versions so drift arrives here as a readable
      # line rather than later as an opaque red (mirrors test.yml's "which node").
      - name: Toolchain versions
        run: |
          echo "java:        $(java -version 2>&1 | head -1 || echo ABSENT)"
          echo "JAVA_HOME:   ${JAVA_HOME:-unset}"
          echo "ANDROID_HOME:${ANDROID_HOME:-unset} ANDROID_SDK_ROOT:${ANDROID_SDK_ROOT:-unset}"

      # The always-on gate: a clean debug build needs no secrets. --no-daemon because
      # the runner is ephemeral (a persistent daemon buys nothing). The -D override is
      # the defensive JDK-21 piece (see header).
      - name: assembleDebug (always-on gate)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME"

      # Conditional signed release. Runs ONLY when the signing secrets exist (the
      # presence flag is 'true'), so until a repo admin provisions them this step is
      # skipped and the debug gate above is the whole value. Signed-vs-unsigned output
      # is governed by android/app/build.gradle's own release signingConfig (added in
      # the #718 signing PR, now on main): it signs only when the keystore AND both
      # passwords are present, and otherwise stays unsigned with a WARN rather than
      # failing. So this step can legitimately produce an unsigned APK on a partial
      # secret set -- read build.gradle's WARN, not just this step's green.
      #
      # Expected secrets (names are the contract for whoever provisions them later):
      #   KOSMOS_UPLOAD_KEYSTORE_BASE64  - the upload .jks, base64-encoded
      #   KOSMOS_UPLOAD_STORE_PASSWORD   - store password
      #   KOSMOS_UPLOAD_KEY_PASSWORD     - key password
      #   KOSMOS_UPLOAD_KEY_ALIAS        - alias (optional; build.gradle defaults it)
      - name: assembleRelease (only when signing secrets are present)
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
        working-directory: android
        env:
          KOSMOS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.KOSMOS_UPLOAD_KEYSTORE_BASE64 }}
          KOSMOS_UPLOAD_STORE_PASSWORD: ${{ secrets.KOSMOS_UPLOAD_STORE_PASSWORD }}
          KOSMOS_UPLOAD_KEY_PASSWORD: ${{ secrets.KOSMOS_UPLOAD_KEY_PASSWORD }}
          KOSMOS_UPLOAD_KEY_ALIAS: ${{ secrets.KOSMOS_UPLOAD_KEY_ALIAS }}
        run: |
          # Decode the keystore to a runner-local file (never committed) via a
          # here-string, NOT a pipe: base64 is then the step's own last command, so a
          # decode failure is its non-zero exit and aborts the step under the default
          # `bash -e`. Point build.gradle's KOSMOS_UPLOAD_KEYSTORE env var at the file.
          base64 --decode <<< "$KOSMOS_UPLOAD_KEYSTORE_BASE64" > "$RUNNER_TEMP/kosmos-upload.jks"
          export KOSMOS_UPLOAD_KEYSTORE="$RUNNER_TEMP/kosmos-upload.jks"
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME"
