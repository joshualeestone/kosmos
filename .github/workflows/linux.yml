# #4919: the node half of the test suite (KOSMOS_TEST_PART=node), run on ubuntu-latest. The shell half
# does not run on Linux yet.
#
# Runs on demand (workflow_dispatch), and on pushes to a linux-ci-* branch so the lane can be run before
# it is on main. Not on every pull request: until the rest of the port lands (#4916 pieces B and D) the
# Linux suite is expected to fail, and a required-looking red on every PR would cost every PR a slot on
# the shared runners. Part of the Linux port (#4916, umbrella #4903).
#
# ⚠️ RED BY DESIGN for now, and it has no list of which reds are expected (unlike tools/windows-tests.js's
# KNOWN_RED), so read the failing FILES, not the colour. Expected on 2026-10-06 (run 37523489451, before
# #4919's Linux-only skips): the installer tests (install.*: #4920), the Claude Code and runner download
# tests (engine/runners, engine/connect*, server.runners, engine/muserun: #5419), and
# report-hook-killguard-4671's awk fallback (#5420). Anything else red is new. A known-red list is a
# follow-up once those land (#4919).

name: linux

on:
  workflow_dispatch:
  push:
    branches: ['linux-ci-*']

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  suite:
    name: suite (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: which node is this
        run: node --version
      - name: install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux lsof zsh >/dev/null
      - name: the node suite on Linux (#4919)
        run: |
          KOSMOS_TEST_PART=node KOSMOS_NO_WAIT=1 tools/run-tests.sh
