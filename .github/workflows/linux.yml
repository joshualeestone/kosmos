# #4919: the node half of the test suite (KOSMOS_TEST_PART=node), run on ubuntu-latest. (The shell half runs
# on ubuntu-latest in test.yml since #6791, apart from tools/shell-macos-only.txt.)
#
# Runs on demand (workflow_dispatch), and on pushes to a linux-ci-* branch so the lane can be run before
# it is on main. Not on every pull request: until the rest of the port lands (#4916 pieces B and D) the
# Linux suite is expected to fail, and a required-looking red on every PR would cost every PR a slot on
# the shared runners. Part of the Linux port (#4916, umbrella #4903).
#
# ⚠️ RED BY DESIGN for now, and it has no list of which reds are expected (unlike tools/windows-tests.js's
# KNOWN_RED), so read the failing FILES, not the colour. The files measured red on 2026-10-06 (runs 37523489451
# and 37531000100) that this branch leaves red, each carried by a card:
#   #4920 (setup on Linux): install.reachable-1662, install.claude-gate, install.uninstall-litter-1547,
#     install.uninstall-watchdog-2955
#   #5419 slice 2 (provider runners on Linux) pins engine/runners' Mac-shaped fixtures to darwin/arm64; measured on
#     run 37571724460 (linuxrunners-5419, read per file): engine/runners 22 failing names to 0, every runner and
#     platform test file 0, the suite 83 to 60;
#     server.runners (the claude route and an Antigravity check) and engine/muserun (turn timing) are for the Linux
#     skip sweep (#4919): the runner pins do not touch them. Slice 1 (Claude Code
#     downloads) turned engine/connect, connect.install-997, connect.nobinary-1580 and connect.hookwiring-1569
#     green: run 37599038975 on linuxclaude-5419 7f6ccadbe (the final connect code, and the test of the real C-library
#     detection on this glibc host, which ran and passed), read per file: none of its 82 failing test names is in
#     those four, platform, the download gate or reachable.
#   #5420 (kill guard timing): report-hook-killguard-4671
#   #5424 (folder preview vs act on a case-sensitive disk): engine/projects (one test)
# A red in any other file is new. A known-red list is a follow-up once those land (#4919).

name: linux

on:
  workflow_dispatch:
  push:
    branches: ['linux-ci-*']

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# kosmos#6742: dead-address the install "created" ping so CI never records a real
# install. A board started here reads this at ping time (engine/createdbeacon.js), and
# engine/linuxboard.js injects it into a systemd board unit, so the POST goes to
# loopback:9 instead of installkosmos.com. Guarded by tools/test-ci-created-url-6742.sh.
env:
  AGENT_WORKFORCE_CREATED_URL: http://127.0.0.1:9/api/created

jobs:
  suite:
    name: suite (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: which node is this
        run: node --version
      - name: install system dependencies
        # kosmos#8380: as test.yml's Linux tools step: only what the image lacks, and Ubuntu hosts the runner cannot
        # resolve are pinned from a public resolver before trying again.
        run: |
          missing=""
          for t in tmux lsof zsh; do command -v "$t" >/dev/null 2>&1 || missing="$missing $t"; done
          if [ -z "$missing" ]; then echo "all three tools are on the image"; exit 0; fi
          repoint_security() {   # Ubuntu's own DNS stopped answering (11-11); pin each Ubuntu host the runner cannot resolve
            # to an address from a public resolver. apt still checks every index's signature, so a wrong address cannot pass.
            pinned=0
            for h in security.ubuntu.com archive.ubuntu.com azure.archive.ubuntu.com; do
              if timeout 5 getent hosts "$h" >/dev/null 2>&1; then continue; fi
              ip=$(curl -sS -m 10 "https://dns.google/resolve?name=$h&type=A" 2>/dev/null | grep -oE '"data":"[0-9.]+"' | head -1 | cut -d'"' -f4 || true)
              if [ -n "$ip" ]; then echo "$ip $h" | sudo tee -a /etc/hosts >/dev/null; echo "pinned $h to $ip"; pinned=1; fi
            done
            [ "$pinned" = 1 ]
          }
          timeout 5 getent hosts security.ubuntu.com >/dev/null 2>&1 || { echo "security.ubuntu.com does not resolve"; repoint_security || true; }
          sudo apt-get update -qq || true
          if ! sudo apt-get install -y -qq $missing >/dev/null; then
            repoint_security || true   # bash -e with pipefail: a function run bare could end the step
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq $missing >/dev/null
          fi
      - name: the node suite on Linux (#4919)
        run: |
          KOSMOS_TEST_PART=node KOSMOS_NO_WAIT=1 tools/run-tests.sh
