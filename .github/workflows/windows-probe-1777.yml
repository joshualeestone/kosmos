# PROBE ONLY (#1777): measure which platform-sensitive test files pass on a real
# Windows runner today. Runs on pushes to this branch only; removed before the PR.
name: windows-probe-1777

on:
  push:
    branches: ["win-ci-1777"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: which node is this
        run: |
          echo "node: $(node --version)"; echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          node -e "console.log('O_NOFOLLOW', require('fs').constants.O_NOFOLLOW, 'delimiter', JSON.stringify(require('path').delimiter))"
      - name: the three reds, full output
        run: |
          for f in engine/projects.win32-reveal.test.js engine/trust.win32-key-2281.test.js engine/win32handoff.test.js; do
            echo "######## $f"
            node --test --test-timeout=60000 "$f" < /dev/null > red.txt 2>&1 || true
            grep -vE "^\s*(✔|ℹ)|^\s+at " red.txt || true
          done
