# #4904: a measurement on a THROWAWAY branch (never merged). Boots today's board on ubuntu-latest.
name: linux-spike-4904
on:
  push:
    branches: ["linuxspike-4904"]
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: install tmux and deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux >/dev/null
          tmux -V
          npm install -g @anthropic-ai/claude-code --no-audit --no-fund >/dev/null 2>&1 && echo "claude code installed: $(command -v claude)" || echo "claude code install failed" 
      - name: block every outbound connection (logged), so nothing reaches a public counter
        run: |
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A OUTPUT -j LOG --log-prefix "SPIKE-OUT " --log-level 4
          sudo iptables -A OUTPUT -j REJECT
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ip6tables -A OUTPUT -j LOG --log-prefix "SPIKE-OUT6 " --log-level 4
          sudo ip6tables -A OUTPUT -j REJECT
          ( curl -sS -m 5 https://installkosmos.com/ >/dev/null && echo "CONTROL FAILED: outbound still open" ) || echo "control: outbound blocked, as intended"
      - name: "A: the board as it is today"
        run: SPIKE_LABEL=A node spike/run.js; tmux kill-server 2>/dev/null || true
      - name: "B: Linux added to the platform gate (a local edit on the runner, never committed)"
        if: always()
        run: |
          sed -i "s/const SUPPORTED = Object.freeze(\['darwin', 'win32'\]);/const SUPPORTED = Object.freeze(['darwin', 'win32', 'linux']);/" engine/platform.js
          grep -n "const SUPPORTED" engine/platform.js
          SPIKE_LABEL=B node spike/run.js; tmux kill-server 2>/dev/null || true
      - name: "B2: as B, with tmux at its Linux path"
        if: always()
        run: SPIKE_LABEL=B2 AGENT_WORKFORCE_TMUX_BIN="$(command -v tmux)" node spike/run.js; tmux kill-server 2>/dev/null || true
      - name: "C: the agent keep-alive as a systemd user unit"
        if: always()
        run: bash spike/systemd.sh
      - name: "D: the real Claude Code CLI in tmux"
        if: always()
        run: bash spike/claude-pane.sh
      - name: what tried to go out
        if: always()
        run: |
          sudo dmesg | grep -E "SPIKE-OUT" | sed -E 's/.*(SPIKE-OUT6? ).*(DST=[^ ]+).*(DPT=[0-9]+).*/\1\2 \3/' | sort | uniq -c || true
      - name: summary
        if: always()
        run: |
          cat "$RUNNER_TEMP/spike-summary.txt" || true
          for f in "$RUNNER_TEMP"/board-*.log; do echo "===== $f ====="; cat "$f"; done 2>/dev/null || true
  suite:
    # E: the node test suite as it is, on Linux, to size how much of it assumes a Mac. Measurement only.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: tmux, then block outbound (logged)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux >/dev/null
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A OUTPUT -j LOG --log-prefix "SPIKE-OUT " --log-level 4
          sudo iptables -A OUTPUT -j REJECT
      - name: "E: the node suite on Linux"
        run: |
          set +e
          KOSMOS_TEST_PART=node KOSMOS_NO_WAIT=1 timeout 40m bash tools/run-tests.sh --test-reporter=tap > "$RUNNER_TEMP/suite.tap" 2>&1
          echo "suite rc=$?"
          echo "== totals"; grep -E "^# (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms)" "$RUNNER_TEMP/suite.tap" | tail -9
          echo "== failing top-level tests (file : test)"
          grep -nE "^not ok [0-9]+ - " "$RUNNER_TEMP/suite.tap" | head -400
          echo "== tail"; tail -40 "$RUNNER_TEMP/suite.tap"
          true
      - name: what tried to go out
        if: always()
        run: sudo dmesg | grep -E "SPIKE-OUT" | sed -E 's/.*(SPIKE-OUT ).*(DST=[^ ]+).*(DPT=[0-9]+).*/\1\2 \3/' | sort | uniq -c || true
