# The FULL page-layer set, nightly on main (#2518).
#
# 🛑 WHY. browser-checks.yml runs only the headless-robust DOM-state allowlist on PRs.
# Every other check (render-fields, render-thread, render-push-718, ...) first ran at
# the release cut's 3b, so a PR that broke one merged green and the break surfaced at
# the cut, the most expensive place. Measured 2026-09-24: #3493 (a CSS contrast change
# in web/index.html) broke render-fields on both engines, merged green, and blocked the
# 0.6.91 staging cut. The surface map (tools/bc-surface-map.sh covering) could not have
# picked render-fields for that diff: it maps DOM ids, and the change was CSS.
#
# 🔑 WHY NIGHTLY ON MAIN, NOT PER PR. A per-PR job was tried in review and rejected:
# a red check run on a PR stops /merge-on-green even under continue-on-error, the
# full set is known to false-red on this runner (see browser-checks.yml's header),
# and a 30-75 minute job per web PR contends for the account's macOS runners. Nightly
# on main moves first detection from "the next cut" to "the next morning", with no
# merge friction, and every night on an unchanged tree adds to the runner baseline.
#
# workflow_dispatch runs it on demand: `gh workflow run browser-checks-full.yml --ref main`
# before a cut. Dispatching on a PR's own branch attaches the run to that PR's head commit,
# so a runner false-red there can stop /merge-on-green, the very thing this design avoids:
# dispatch on a throwaway branch pointing at the same commit instead.
# The checkout is detached (see the job), so browser-checks.sh takes the same single-process
# path as the cut's 3b. Still, the full set has never run on this runner before its first
# night: dispatch once before relying on the first card.
#
# ⚠️ LIMIT: a check that is red EVERY night on this runner is never NEW, so a real regression
# in that same check adds no signal, and the card stays open with a comment a night. The card
# says so; the remedy is to fix the check or record it as runner noise, not to read past it.
#
# Same script and pin as the cut's 3b: tools/browser-checks.sh with no
# KOSMOS_BC_CI_ALLOWLIST runs every check, headless (run_one sets HEADED=0).
name: browser-checks-full

on:
  schedule:
    # 09:30 UTC (04:30 CDT / 03:30 CST): done before the working day's cuts.
    - cron: '30 9 * * *'
  workflow_dispatch:

# Least privilege per job: the checks job (third-party npm installs, every browser
# check) holds only contents: read. Only the separate card job holds issues: write, and
# nothing else (job permissions REPLACE the workflow's; it makes issue and label calls only).
permissions:
  contents: read

# Every run step as bash -eo pipefail. Without this a step runs as plain `bash -e`, where a
# pipeline's status is its LAST command's: the card's "could not read the last report"
# branch could never fire (found in review). The test pins this default and runs the
# embedded scripts under the same flags.
defaults:
  run:
    shell: bash

concurrency:
  # One lane per trigger, so a dispatch before a cut can never supersede a PENDING nightly
  # (a superseded pending run starts no jobs and so would file no card).
  group: browser-checks-full-${{ github.ref }}-${{ github.event_name }}
  # A run in progress is never superseded; let it finish. (Within the schedule lane a
  # pending run could only be replaced by the next night's.)
  cancel-in-progress: false

jobs:
  browser-checks-full:
    runs-on: macos-latest
    # The runner's full-set duration is not measured yet (a dispatch run needs this file on
    # main); the cut's 3b render window is ~16 minutes on a dev Mac. Sized generously, and
    # any non-success, a timeout included, still files a card (see file-red-card).
    timeout-minutes: 170
    outputs:
      failed: ${{ steps.failed.outputs.labels }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # DETACHED, like the cut's frozen tree: on a branch, browser-checks.sh freezes the tree
      # and re-execs itself (a path the cut never takes); nothing can move a runner's own
      # checkout mid-run, so the freeze buys nothing here and only differs from the cut.
      - name: 'detach HEAD, as the cut runs it (#2518)'
        run: git checkout --detach
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: which node is this
        run: |
          echo "node: $(node --version 2>&1 || echo ABSENT)"
          echo "npm:  $(npm --version 2>&1 || echo ABSENT)"
      - name: 'provision the pinned Playwright runtime (#1594)'
        timeout-minutes: 20
        run: bash tools/provision-pw.sh
      - name: 'the FULL page layer, headless, every check (tools/browser-checks.sh, #2518)'
        id: checks
        timeout-minutes: 120
        run: |
          set -o pipefail
          KOSMOS_PW_STRICT_VERSION=1 bash tools/browser-checks.sh 2>&1 | tee "$RUNNER_TEMP/browser-checks.log"
      # The labels of the checks that went red, for the card. Read from the driver's own
      # summary (`FAILED-LIST:  a|b (why)|c`, one entry per "|", since entries can contain
      # spaces), not from FAIL lines, which the individual checks also print.
      - name: 'collect the red check labels (#2518)'
        id: failed
        if: always()
        run: |
          # Must not abort under -e (and pipefail, the stricter case) when an earlier step
          # failed and left no log: the fallback line below has to run either way.
          log="$RUNNER_TEMP/browser-checks.log"
          labels=""
          # Any spacing after the token, so a cosmetic edit to the driver's log line cannot
          # silently empty every card (the driver's token itself is pinned by the test).
          if [ -f "$log" ]; then labels=$(sed -n 's/^FAILED-LIST:[[:space:]]*//p' "$log" | tail -n 1 || true); fi
          echo "labels=${labels:-(none captured; see the run log)}" >> "$GITHUB_OUTPUT"

  # 🔑 A nightly red must reach the fleet, not just the run's actor (GitHub mails only
  # them). So every SCHEDULED run reports into the work queue the fleet reads: any
  # non-success (failure, a timeout, a cancel) opens a card or comments on the open one,
  # leading with the checks NEW since the last red night, so a regression stands out
  # from runner noise; the first green scheduled run closes the card, so a streak ends.
  # A dispatch of this file as written never reaches this job (the schedule gate), so a
  # dispatched branch does not get the token; editing the gate needs push access anyway.
  file-red-card:
    needs: browser-checks-full
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 'report a scheduled run to the card (#2518)'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RED: ${{ needs.browser-checks-full.outputs.failed }}
          RESULT: ${{ needs.browser-checks-full.result }}
        run: |
          # A transient API error must not lose a red night: the READS and the close (safe to
          # repeat) retry, and a final failure is an ::error:: annotation on the run. Creating
          # a card or commenting is NOT retried: a request that failed after GitHub had done
          # it would be done twice (a duplicate card, a doubled report).
          ghr() { local i; for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep $((i * ${GH_RETRY_SECONDS:-10})); done
                  echo "::error::$1 $2 $3 failed 3 times; see the steps above. Run: $RUN_URL" >&2; return 1; }
          gh1() { "$@" || { echo "::error::$1 $2 $3 failed; the card was NOT updated for this run (not retried, so it cannot be done twice). Run: $RUN_URL" >&2; return 1; }; }
          label=nightly-browser-checks-red
          # If even this lookup fails, the report is not dropped: a red night files a NEW card
          # (a possible duplicate is better than silence); a green night does nothing.
          lookup_failed=""
          open=$(ghr gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$label" --json number -q '.[0].number') || { open=""; lookup_failed=1; }
          [ -n "$lookup_failed" ] && [ "$RESULT" = success ] && exit 0
          [ "$open" = null ] && open=""
          if [ "$RESULT" = success ]; then
            [ -n "$open" ] || exit 0
            # Only a FIRST attempt may close: a re-run of an older night (same event, old sha)
            # must not close a card a newer red night opened. First attempts of the schedule
            # lane cannot finish out of order (one lane, never cancelled, 24h apart, capped at
            # 170 minutes), so the attempt alone decides; comparing with main's head would
            # refuse most green nights, since merges land overnight.
            if [ "${GITHUB_RUN_ATTEMPT:-1}" != 1 ]; then
              gh1 gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "A re-run (attempt ${GITHUB_RUN_ATTEMPT}) of the night at $GITHUB_SHA was green: $RUN_URL. Not closing on a re-run; the next scheduled night decides." || true
              exit 0
            fi
            cards=$(ghr gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$label" --json number -q '.[].number') || cards="$open"
            for n in $cards; do
              # The note once (a retried comment would post twice), then the close (safe to repeat).
              gh1 gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Green again at $GITHUB_SHA: $RUN_URL. Closing; the next red night opens a new card." || true
              ghr gh issue close "$n" --repo "$GITHUB_REPOSITORY"
            done
            exit 0
          fi
          # Entries are separated by "|" (they can contain spaces); shown as " | ".
          red=$(printf '%s' "${RED:-(none captured; see the run log)}" | sed 's/[[:space:]]*|[[:space:]]*/ | /g')
          if [ -n "$open" ]; then
            # The entries named by this card's most recent report, found by the opening words
            # this job writes (startswith: same meaning in gh's gojq and in jq; a person
            # pasting a report verbatim would also match), so only NEW ones lead.
            # If that report cannot be read, say so rather than calling everything new.
            unread=""
            if ! prev=$(ghr gh issue view "$open" --repo "$GITHUB_REPOSITORY" --json body,comments \
                -q '[.body] + [.comments[].body] | map(select(startswith("The nightly full") or startswith("Still not green"))) | last // ""' \
                | tr -d '\r' | sed -n 's/^.*Red checks: //p' | tail -n 1); then
              prev=""; unread=" (the previous report could not be read, so every entry is listed)"
            fi
            new=""
            set -f; _ifs=$IFS; IFS='|'
            for w in $red; do
              w="${w# }"; w="${w% }"; [ -n "$w" ] || continue
              seen=""
              for q in $prev; do q="${q# }"; q="${q% }"; [ "$q" = "$w" ] && seen=1; done
              [ -n "$seen" ] || new="${new:+$new | }$w"
            done
            IFS=$_ifs; set +f
            rerun=""; [ "${GITHUB_RUN_ATTEMPT:-1}" != 1 ] && rerun=" (a re-run, attempt ${GITHUB_RUN_ATTEMPT}, of an earlier night)"
            gh1 gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Still not green ($RESULT) at $GITHUB_SHA$rerun: $RUN_URL
          NEW since the last red night: ${new:-none}$unread
          Red checks: $red"
          else
            # A red night with no open card MUST end with a card. A failed label lookup counts as
            # "not known"; a label that cannot be created means the card is filed without it.
            have=$(ghr gh label list --repo "$GITHUB_REPOSITORY" --search "$label" --json name -q '.[].name') || have=""
            if ! grep -qx "$label" <<<"$have"; then
              # --force succeeds whether or not the label exists, so a failed LOOKUP of an
              # existing label cannot end in an unlabelled (never found, never closed) card.
              if gh label create "$label" --repo "$GITHUB_REPOSITORY" --color B60205 --force \
                   --description "The nightly full browser-check run on main is not green (#2518)"; then have="$label"
              else echo "::warning::could not create the $label label; filing the card without it"; fi
            fi
            labelled=(); grep -qx "$label" <<<"$have" && labelled=(--label "$label")
            rerun_note=""; [ "${GITHUB_RUN_ATTEMPT:-1}" != 1 ] && rerun_note=" This card was filed by a RE-RUN (attempt ${GITHUB_RUN_ATTEMPT}) of an earlier night; main may be green since."
            card_body="The nightly full page-layer run (browser-checks-full.yml, #2518) ended $RESULT on main at $GITHUB_SHA: $RUN_URL$rerun_note

          Red checks: $red

          Decide per check: a product regression (fix it before the next cut), or runner noise (record it here, with its output, as part of the runner baseline). Each further night that is not green comments here and leads with the checks NEW since the last one. The first green scheduled night (a first attempt) closes this card. A check that is red EVERY night is never NEW, so a regression inside it adds no signal: fix it or record it as runner noise rather than reading past it."
            [ "${#labelled[@]}" -eq 0 ] && card_body="$card_body

          (Filed without the $label label, which could not be created: add it, or the next red night will not find this card.)"
            create_card() { gh issue create --repo "$GITHUB_REPOSITORY" ${labelled[@]+"${labelled[@]}"} \
              --title "Nightly full browser-check run is not green on main" --body "$card_body"; }
            # Not blindly retried (a create that failed after GitHub did it would duplicate):
            # wait, look for the card, and create again only if there is none.
            if ! create_card; then
              sleep "${GH_RETRY_SECONDS:-10}"
              # Look by label, or by title when the card had to be filed without one.
              if [ "${#labelled[@]}" -gt 0 ]; then
                again=$(ghr gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$label" --json number -q '.[0].number') || again=""
              else
                # An exact title match over the open list, not GitHub search (whose index lags).
                again=$(ghr gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title -q 'map(select(.title == "Nightly full browser-check run is not green on main")) | .[0].number') || again=""
              fi
              [ "$again" = null ] && again=""
              if [ -z "$again" ]; then
                gh1 create_card
              fi
            fi
          fi
