# The FULL page-layer set, nightly on main (#2518).
#
# 🛑 WHY. browser-checks.yml runs only the headless-robust DOM-state allowlist on PRs.
# Every other check (render-fields, render-thread, render-push-718, ...) first ran at
# the release cut's 3b, so a PR that broke one merged green and the break surfaced at
# the cut, the most expensive place. Measured 2026-09-24: #3493 (a CSS contrast change
# in web/index.html) broke render-fields on both engines, merged green, and blocked the
# 0.6.91 staging cut. The surface map (tools/bc-surface-map.sh covering) could not have
# picked render-fields for that diff: it maps DOM ids, and the change was CSS.
#
# 🔑 WHY NIGHTLY ON MAIN, NOT PER PR. A per-PR job was tried in review and rejected:
# a red check run on a PR stops /merge-on-green even under continue-on-error, the
# full set is known to false-red on this runner (see browser-checks.yml's header),
# and a 30-75 minute job per web PR contends for the account's macOS runners. Nightly
# on main moves first detection from "the next cut" to "the next morning", with no
# merge friction, and every night on an unchanged tree adds to the runner baseline.
#
# workflow_dispatch runs it on demand, on any branch: `gh workflow run
# browser-checks-full.yml --ref <branch>` before a cut, or on a risky web PR.
#
# Same script and pin as the cut's 3b: tools/browser-checks.sh with no
# KOSMOS_BC_CI_ALLOWLIST runs every check, headless (run_one sets HEADED=0).
name: browser-checks-full

on:
  schedule:
    # 09:30 UTC (04:30 CDT / 03:30 CST): done before the working day's cuts.
    - cron: '30 9 * * *'
  workflow_dispatch:

# Least privilege per job: the checks job (third-party npm installs, every browser
# check) holds only contents: read. Only the separate card job holds issues: write.
permissions:
  contents: read

# Every run step as bash -eo pipefail. Without this a step runs as plain `bash -e`, where a
# pipeline's status is its LAST command's: the card's "could not read the last report"
# branch could never fire (found in review). The test pins this default and runs the
# embedded scripts under the same flags.
defaults:
  run:
    shell: bash

concurrency:
  group: browser-checks-full-${{ github.ref }}
  # A run in progress is never superseded; let it finish. (A PENDING run can still be
  # replaced by a newer queued one. Such a run starts no jobs at all, so it is not
  # reported; it needs a third run queued on main, e.g. a dispatch during the nightly.)
  cancel-in-progress: false

jobs:
  browser-checks-full:
    runs-on: macos-latest
    # The runner's full-set duration is not measured yet (a dispatch run needs this file on
    # main); the cut's 3b render window is ~16 minutes on a dev Mac. Sized generously, and
    # any non-success, a timeout included, still files a card (see file-red-card).
    timeout-minutes: 150
    outputs:
      failed: ${{ steps.failed.outputs.labels }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: which node is this
        run: |
          echo "node: $(node --version 2>&1 || echo ABSENT)"
          echo "npm:  $(npm --version 2>&1 || echo ABSENT)"
      - name: 'provision the pinned Playwright runtime (#1594)'
        timeout-minutes: 20
        run: bash tools/provision-pw.sh
      - name: 'the FULL page layer, headless, every check (tools/browser-checks.sh, #2518)'
        id: checks
        timeout-minutes: 120
        run: |
          set -o pipefail
          KOSMOS_PW_STRICT_VERSION=1 bash tools/browser-checks.sh 2>&1 | tee "$RUNNER_TEMP/browser-checks.log"
      # The labels of the checks that went red, for the card. Read from the driver's own
      # summary (`FAILED-LIST:  a|b (why)|c`, one entry per "|", since entries can contain
      # spaces), not from FAIL lines, which the individual checks also print.
      - name: 'collect the red check labels (#2518)'
        id: failed
        if: always()
        run: |
          # Must not abort under -e (and pipefail, the stricter case) when an earlier step
          # failed and left no log: the fallback line below has to run either way.
          log="$RUNNER_TEMP/browser-checks.log"
          labels=""
          if [ -f "$log" ]; then labels=$(sed -n 's/^FAILED-LIST:  //p' "$log" | tail -n 1 || true); fi
          echo "labels=${labels:-(none captured; see the run log)}" >> "$GITHUB_OUTPUT"

  # 🔑 A nightly red must reach the fleet, not just the run's actor (GitHub mails only
  # them). So every SCHEDULED run reports into the work queue the fleet reads: any
  # non-success (failure, a timeout, a cancel) opens a card or comments on the open one,
  # leading with the checks NEW since the last red night, so a regression stands out
  # from runner noise; the first green scheduled run closes the card, so a streak ends.
  # A dispatch of this file as written never reaches this job (the schedule gate), so a
  # dispatched branch does not get the token; editing the gate needs push access anyway.
  file-red-card:
    needs: browser-checks-full
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 'report a scheduled run to the card (#2518)'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RED: ${{ needs.browser-checks-full.outputs.failed }}
          RESULT: ${{ needs.browser-checks-full.result }}
        run: |
          label=nightly-browser-checks-red
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$label" --json number -q '.[0].number')
          [ "$open" = null ] && open=""
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Green again at $GITHUB_SHA: $RUN_URL. Closing; the next red night opens a new card."
            fi
            exit 0
          fi
          # Entries are separated by "|" (they can contain spaces); shown as " | ".
          red=$(printf '%s' "${RED:-(none captured)}" | sed 's/[[:space:]]*|[[:space:]]*/ | /g')
          if [ -n "$open" ]; then
            # The entries named by this card's most recent report, found by the opening words
            # this job writes (startswith: same meaning in gh's gojq and in jq; a person
            # pasting a report verbatim would also match), so only NEW ones lead.
            # If that report cannot be read, say so rather than calling everything new.
            unread=""
            if ! prev=$(gh issue view "$open" --repo "$GITHUB_REPOSITORY" --json body,comments \
                -q '[.body] + [.comments[].body] | map(select(startswith("The nightly full") or startswith("Still not green"))) | last // ""' \
                | sed -n 's/^.*Red checks: //p' | tail -n 1); then
              prev=""; unread=" (the previous report could not be read, so every entry is listed)"
            fi
            new=""
            set -f; _ifs=$IFS; IFS='|'
            for w in $red; do
              w="${w# }"; w="${w% }"; [ -n "$w" ] || continue
              seen=""
              for q in $prev; do q="${q# }"; q="${q% }"; [ "$q" = "$w" ] && seen=1; done
              [ -n "$seen" ] || new="${new:+$new | }$w"
            done
            IFS=$_ifs; set +f
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Still not green ($RESULT) at $GITHUB_SHA: $RUN_URL
          NEW since the last red night: ${new:-none}$unread
          Red checks: $red"
          else
            have=$(gh label list --repo "$GITHUB_REPOSITORY" --search "$label" --json name -q '.[].name')
            if ! printf '%s\n' "$have" | grep -qx "$label"; then
              gh label create "$label" --repo "$GITHUB_REPOSITORY" --color B60205 \
                --description "The nightly full browser-check run on main is not green (#2518)"
            fi
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" \
              --title "Nightly full browser-check run is not green on main" \
              --body "The nightly full page-layer run (browser-checks-full.yml, #2518) ended $RESULT on main at $GITHUB_SHA: $RUN_URL

          Red checks: $red

          Decide per check: a product regression (fix it before the next cut), or runner noise (record it here, with its output, as part of the runner baseline). Each further night that is not green comments here and leads with the checks NEW since the last one. The first green scheduled night closes this card."
          fi
