# kosmos#7933: the #7777 promote check's Linux legs, on a STOCK Ubuntu 24.04 (real x86_64, real systemd), against what
# the site serves: prod's own verifier on the staged Linux tarball (with controls), the data going up to staging and back
# to prod, and a prod install from the served /setup updated in place by the served installer with
# KOSMOS_UPDATE_CHANNEL=staging (how a Linux board updates: it does not self-install). The fresh install from /setup-staging is
# linux-family-install-7281.yml; run both for a promote check:
#     gh workflow run linux-family-install-7281.yml -f channel=staging
#     gh workflow run linux-promote-check-7933.yml
# Not on pull requests: it reads the live site, so a PR cannot change what it tests. A promote needs it: a green run
# from main records the build it checked (the record job below), and tools/promote-channel.sh refuses to move
# latest-linux.json without that record and linux-family-install-7281.yml's for the same sha (kosmos#7942). The legs are
# tools/promote-check-legs-7933.sh (verify and data also run on a Mac: `bash tools/promote-check-legs-7933.sh data mac`).

name: linux-promote-check

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'the site to read the pointers and builds from'
        required: true
        default: https://installkosmos.com
      old_version:
        description: 'kosmos#7941: also run the update verb from this older build to the staged one (the previous cut, say)'
        required: false
        default: ''
  # As linux.yml's linux-ci-*: a push to a linux-promote-ci-* branch runs it before it is on main.
  push:
    branches: ['linux-promote-ci-*']

permissions:
  contents: read

# kosmos#6742 / #5519: these boards must not count as installs (as linux-family-install-7281.yml).
env:
  AGENT_WORKFORCE_CREATED_URL: http://127.0.0.1:9/api/created
  AGENT_WORKFORCE_FEEDBACK_URL: http://127.0.0.1:9/api/feedback
  AGENT_WORKFORCE_COMMUNITY_URL: http://127.0.0.1:9
  KOSMOS_NO_OPEN: '1'
  KOSMOS_PORT: '16180'
  SITE: ${{ inputs.site || 'https://installkosmos.com' }}

jobs:
  verify-and-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      verify_version: ${{ steps.verify.outputs.verify_version }}
      verify_sha256: ${{ steps.verify.outputs.verify_sha256 }}
      data_version: ${{ steps.data.outputs.data_version }}
      data_sha256: ${{ steps.data.outputs.data_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Hide every system node, so the legs run on the builds' own
        run: |
          for n in $( (which -a node nodejs 2>/dev/null || true) | sort -u); do sudo mv "$n" "$n.hidden-7933" && echo "$n" >> "$RUNNER_TEMP/hidden-nodes-7933"; done
          if command -v node >/dev/null 2>&1; then echo "FAIL: a system node is still on PATH: $(command -v node)" >&2; exit 1; fi
          echo "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_ENV"
      - name: Prod's verifier accepts the staged Linux build, and refuses the controls
        id: verify
        run: bash tools/promote-check-legs-7933.sh verify linux
      - name: The data goes up to staging and back to prod
        id: data
        if: success() || failure()
        run: bash tools/promote-check-legs-7933.sh data linux
      - name: Put the system node back
        if: always()
        run: if [ -f "$RUNNER_TEMP/hidden-nodes-7933" ]; then while read -r n; do sudo mv "$n.hidden-7933" "$n" || true; done < "$RUNNER_TEMP/hidden-nodes-7933"; fi

  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      update_version: ${{ steps.update.outputs.update_version }}
      update_sha256: ${{ steps.update.outputs.update_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Hide every system node, so the install must bring its own
        run: |
          for n in $( (which -a node nodejs 2>/dev/null || true) | sort -u); do sudo mv "$n" "$n.hidden-7933" && echo "$n" >> "$RUNNER_TEMP/hidden-nodes-7933"; done
          if command -v node >/dev/null 2>&1; then echo "FAIL: a system node is still on PATH: $(command -v node)" >&2; exit 1; fi
          echo "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_ENV"
      - name: Prepare the systemd user session (as a person's login has)
        run: |
          sudo loginctl enable-linger "$USER" || true
          sudo systemctl start user@"$(id -u)".service || true
          mkdir -p "/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: A prod install is updated to staging by the served installer and keeps its project
        id: update
        run: bash tools/promote-check-legs-7933.sh update linux
      - name: Put the system node back
        if: always()
        run: if [ -f "$RUNNER_TEMP/hidden-nodes-7933" ]; then while read -r n; do sudo mv "$n.hidden-7933" "$n" || true; done < "$RUNNER_TEMP/hidden-nodes-7933"; fi

  # kosmos#7941: #7935's update verb on a real board. Not needed by `record`: see leg_verb. Only when asked (or on a
  # linux-promote-ci-* push), so an ordinary promote check is not red for a verb nobody asked about.
  verb:
    if: github.event_name == 'push' || inputs.old_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Hide every system node, so the install must bring its own
        run: |
          for n in $( (which -a node nodejs 2>/dev/null || true) | sort -u); do sudo mv "$n" "$n.hidden-7933" && echo "$n" >> "$RUNNER_TEMP/hidden-nodes-7933"; done
          if command -v node >/dev/null 2>&1; then echo "FAIL: a system node is still on PATH: $(command -v node)" >&2; exit 1; fi
          echo "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_ENV"
      - name: Prepare the systemd user session (as a person's login has)
        run: |
          sudo loginctl enable-linger "$USER" || true
          sudo systemctl start user@"$(id -u)".service || true
          mkdir -p "/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: The installed CLI's update verb updates a real board (from old_version, or stamped older without it)
        env:
          VERB_OLD: ${{ inputs.old_version }}
        run: bash tools/promote-check-legs-7933.sh verb linux
      - name: Put the system node back
        if: always()
        run: if [ -f "$RUNNER_TEMP/hidden-nodes-7933" ]; then while read -r n; do sudo mv "$n.hidden-7933" "$n" || true; done < "$RUNNER_TEMP/hidden-nodes-7933"; fi

  # kosmos#7942: the record tools/linux-check-runs.sh looks for before a promote moves latest-linux.json. It exists
  # only when all three legs passed against the live site, on ONE build (each leg read the pointer itself, so a
  # staging cut landing mid-run would show as two shas, and nothing is recorded).
  record:
    needs: [verify-and-data, update]
    if: success() && github.ref == 'refs/heads/main' && (inputs.site || 'https://installkosmos.com') == 'https://installkosmos.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All three legs checked the same build
        id: same
        env:
          VV: ${{ needs.verify-and-data.outputs.verify_version }}
          VS: ${{ needs.verify-and-data.outputs.verify_sha256 }}
          DV: ${{ needs.verify-and-data.outputs.data_version }}
          DS: ${{ needs.verify-and-data.outputs.data_sha256 }}
          UV: ${{ needs.update.outputs.update_version }}
          US: ${{ needs.update.outputs.update_sha256 }}
        run: |
          echo "verify $VV $VS"; echo "data   $DV $DS"; echo "update $UV $US"
          case "$VS" in *[!0-9a-f]*|'') echo "FAIL: the verify leg recorded no sha" >&2; exit 1 ;; esac
          [ "${#VS}" = 64 ] && [ -n "$VV" ] || { echo "FAIL: the verify leg recorded no build" >&2; exit 1; }
          [ "$VV $VS" = "$DV $DS" ] && [ "$VV $VS" = "$UV $US" ] || { echo "FAIL: the legs checked different builds; nothing is recorded" >&2; exit 1; }
          # The update leg read the pointer before its installer did: a re-cut in between would change the bytes.
          now="$(curl -fsS -m 30 https://installkosmos.com/dist/latest-linux-staging.json)"
          printf '%s' "$now" | grep -qF "\"$VS\"" || { echo "FAIL: the staging pointer no longer names $VS; nothing is recorded" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/record"
          printf '{"workflow":"linux-promote-check-7933.yml","version":"%s","sha256":"%s","run":"%s"}\n' "$VV" "$VS" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/record/checked.json"
          echo "name=linux-promote-check-$VV-$VS" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.same.outputs.name }}
          path: ${{ runner.temp }}/record/checked.json
          retention-days: 90
