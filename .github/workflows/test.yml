# The first CI this repo has ever had (#835).
#
# 🛑 WHAT THIS IS AND IS NOT. It runs the full suite (tools/run-tests.sh) on every
# push to `main` and every PR (#3499 gated push to main; see the `on:` block) and
# reports red or green. It is ADVISORY: nothing here blocks a
# merge, because gh pr merge is server-side and no workflow can gate it without
# branch protection with a required check. Branch protection is a separate decision
# (#835): it is available on THIS repo (public) but was deliberately not made
# required, because it gates every merge for the whole Kosmos roster and fights the
# beta "merge fast" posture, and gh pr merge --admin bypasses it anyway. So the real
# gate stays the interim control -- run the suite, read the EXIT CODE (not the
# human summary, since a file-level failure reports as skipped, not failed), do not
# merge red -- and this workflow is the second, visible signal the create-pr CI-watch
# already honors.
#
# WHAT A GREEN TICK CERTIFIES, AND WHAT IT DOES NOT (the card's three warnings,
# answered for this repo rather than assumed to transfer):
#   1. COVERAGE. tools/run-tests.sh runs `node --test engine/*.test.js *.test.js`,
#      naming BOTH trees, so it is the whole unit suite, not a top-level glob that
#      silently drops engine/. It does NOT cover the deployed binary, the live board,
#      or the page in a real browser. A green here is not a statement about production.
#   2. STALENESS. A test can assert a string the product correctly renamed. Only a
#      reader catches that; CI cannot.
#   3. THE HARNESS SWALLOWING A FAILURE. run-tests.sh gates on `node --test`'s EXIT
#      CODE, not on parsing its reporter output, so a format quirk cannot read as a
#      pass. (Contrast the summary line, which can say "0 failed" when whole files
#      failed at the hook level and their tests never ran -- skipped, not failed.)
#
# ⚠️ AND IT WAS PROVEN ABLE TO GO RED before it was trusted, on a throwaway branch
# with a deliberately failing test. A CI that has only ever been green is a check
# nobody has watched fail.

name: test

on:
  push:
    # #3499: gate push to main only (was ["**"]). A same-repo feature-branch PR used
    # to run this suite TWICE -- once for the branch push, once for the pull_request --
    # and the two runs contend on the shared macOS runners. The suite has grown to ~14m
    # (the "~2-3 min" note further down is stale), so under that contention one run
    # crosses the timeout cap and is CANCELLED, which `gh pr checks` reports as `fail`.
    # That forced a manual cancel-vs-fail check on every co-land and risked masking a
    # real failure as "just the cap" (a false-green class). Gating push to main removes
    # the duplicate: a PR now runs the suite ONCE via pull_request, and main still runs
    # it on push (the green-main signal the release cut gates on). The prior code kept
    # push on every branch and called the double-run "harmless"; #3499 is the evidence
    # it was not. A branch pushed but never PR'd is now untested until its PR opens --
    # accepted, because such a branch never merges, so its CI would be moot anyway.
    branches: ["main"]
  pull_request:

# Least privilege: this job only reads the repo and runs the suite; it needs no
# write scope on the token. (Uses pull_request, not pull_request_target, so
# untrusted PR code never runs with elevated access in the first place.)
permissions:
  contents: read

# Cancel a superseded run of the SAME event+ref: a successive sync of a PR cancels its
# in-flight predecessor instead of queuing a redundant run (on main, see #4021 below).
# With push gated to main (above, #3499), a feature branch no longer
# runs the suite for BOTH its push and its PR, so there is no push-and-PR pair left to
# collapse here; this group now only dedupes successive events on the same ref.
#
# 🛑 #4021: EXCEPT ON MAIN, WHERE A RUN IS NEVER CANCELLED. The suite takes ~14m and merges
# landed faster than that on 2026-09-26, so every main run from 17:57Z to 18:49Z was
# cancelled by the next merge: main went red and no run ever finished to say so. It was
# first seen at a release cut's step 3, the most expensive place. With this, a running
# main run always finishes; GitHub still keeps at most ONE pending run per group (a newer
# pending replaces an older pending), so the head of main is always tested next and the
# queue cannot grow. Chosen over one run per main sha (group keyed on github.sha): that
# tests every merge but puts N suites on the shared macOS runners at once, the #3499
# contention. Weakest premise: a red commit that is superseded while PENDING is never run
# on its own, so a bisect means `yarn test` locally at that sha (this workflow has no manual
# trigger); the red itself still shows at the head.
# Cost: under a merge burst a red head can take up to two runs (~2 x 14m) to report.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # 🛑 macOS, NOT ubuntu. This is a macOS app's suite and it is not portable to
    # Linux: measured on ubuntu-latest, ~40 tests fail on platform assumptions the
    # product legitimately makes -- `/tmp` is a symlink on macOS but not on Linux,
    # and the install path refuses with "this platform (linux) is not supported; the
    # Claude Code binary is a macOS build". Those are correct product behaviours, so
    # the fix is the runner, not the tests. macos-latest matches the developer Macs,
    # where the suite is green. (A first attempt on ubuntu-latest went red on exactly
    # these platform tests; recorded so nobody re-picks ubuntu for this suite.)
    runs-on: macos-latest
    # run-tests.sh boots boards and servers; bound a hung run rather than let it
    # sit on the 360-minute default. The suite now runs ~14m (#3499; it has grown well
    # past the old "~2-3 min"), so 15 left almost no margin -- a single slow run could
    # cross it and be CANCELLED (read as `fail`). 30 gives a single run real headroom
    # while still catching a genuine hang at ~2x the runtime.
    timeout-minutes: 30
    steps:
      # #1794: fetch-depth 0 (full history). checkout@v4 shallow-clones by
      # default; #1025's "a range is reduced to its base" resolves a git range,
      # which needs the history a depth-1 clone truncates. The other #1025 arms
      # (plain ref, cutoff filtering) pass shallow; only the range-base one needs it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # #1794: install tmux. run-tests.sh boots boards, and last-look spawns a child
      # that runs status.snapshot() against the environment's tmux; macos-latest ships
      # none, so without this last-look reads 'could not run tmux' instead of the
      # honest no-server empty. brew tmux with no server started is the hermetic
      # no-server path the test's own comment documents as null.
      - name: install tmux (#1794)
        run: brew install tmux
      # PIN THE NODE. Nothing else here declares a version at all (fixed by the
      # .nvmrc and the engines field this branch adds), and the version is not
      # cosmetic. A related repo (#1462, kosmos-relay) was bitten by an OUTPUT
      # FORMAT difference (a spec-prefix guard reading zero on the runner's node);
      # run-tests.sh sidesteps that by gating on the EXIT CODE, not the reporter
      # text. The pin below is about a WORSE, non-format difference #1794 found.
      #
      # #1794: node 26. This repo's suite is written and run on node 26
      # (the developer Macs), and node 22 breaks it: engine/live-execution's
      # inTestProcess() keys on `process.execArgv` containing `--test`, and node
      # 22's test runner runs each file in a child whose execArgv drops it, so
      # the gate reads "not a test process" and #1598's three arms fail on a
      # clean node-22 runner. Measured on node 26: the same tests pass
      # single-file AND multi-file (child-process isolation). The ci-workflow-835
      # base pinned 22 to match kosmos-relay's CI; that repo is Rust with one
      # node page test, this one is pure node and node-26-native, so it tracks
      # its own dev line. #1025 (a range resolution) is the same node-line fix.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      # Say which node this is, so drift within the pinned line arrives here as a
      # legible line rather than later as an unrelated red.
      - name: which node is this
        run: |
          echo "node:  $(node --version 2>&1 || echo ABSENT)"
          echo "npm:   $(npm --version 2>&1 || echo ABSENT)"
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      # No install step, but NOT dependency-free: this repo declares zero package
      # dependencies (empty deps/devDeps, no lockfile), so `yarn install` would
      # install nothing and only add a way to fail. run-tests.sh does two things:
      # `node --test engine/*.test.js *.test.js` (the JS suite) and then, on a green
      # node run, `yarn -s test:shell` (dozens of tools/test-*.sh). So the runner's
      # preinstalled `yarn` and `bash` ARE required at runtime; both ship on
      # ubuntu-latest. Verified green on this recipe on node 22 AND node 26 (both
      # arms of run-tests.sh, exit 0). If GitHub ever drops yarn from the image the
      # suite would exit 127 and red here honestly, which is the correct direction.
      - name: the suite (node --test + yarn test:shell, gated on the exit code)
        run: bash tools/run-tests.sh
